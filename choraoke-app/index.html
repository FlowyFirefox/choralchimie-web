<!DOCTYPE html>
<html lang="fr">
<head>

<title>Choraoké — La ChorAlchimie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)!important;color:#F0EBE3;font-family:'Cormorant Garamond',serif;min-height:100vh;overflow-x:hidden}
:root{--braise:#C25918;--braise-dark:#B04D10;--amethyste:#5A2090;--border:rgba(255,255,255,0.08);--text:#F0EBE3;--sub:rgba(240,235,227,0.65);--muted:rgba(240,235,227,0.45);--bg:#0A0A0A;--s1:#111;--s2:#181818;--s3:#222}
body.light{--bg:#F5EFE3;--s1:#FDFAF5;--s2:#EDE6D6;--s3:#E3D9C6;--text:#2C2416;--sub:rgba(44,36,22,.65);--muted:rgba(44,36,22,.4);--border:rgba(44,36,22,.1);--bsp-bg:rgba(44,36,22,.1);--bsp-bd:rgba(44,36,22,.15)}
.theme-toggle{position:fixed;bottom:76px;right:16px;width:40px;height:40px;border-radius:50%;border:none;background:var(--s2);color:var(--text);font-size:18px;cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.25);transition:transform .15s}.theme-toggle:active{transform:scale(.92)}
.fab{position:fixed;bottom:24px;right:16px;width:52px;height:52px;border-radius:50%;border:none;background:var(--braise);color:#fff;font-size:24px;cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(194,89,24,.35);transition:transform .15s}.fab:active{transform:scale(.92)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}.modal-overlay.open{display:block}
.modal-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 20px env(safe-area-inset-bottom);z-index:301;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch}.modal-sheet.open{transform:translateY(0)}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--muted);margin:0 auto 16px;opacity:.4}
.modal-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--text);margin-bottom:16px}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;letter-spacing:.04em}
.modal-field input{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--text);outline:none;-webkit-appearance:none}.modal-field input:focus{border-color:var(--braise)}
.modal-field input::placeholder{color:var(--muted)}
.modal-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.modal-chips .mchip{padding:6px 12px;border-radius:16px;border:1px solid var(--border);background:var(--s1);font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--sub);cursor:pointer;transition:all .15s;-webkit-user-select:none;user-select:none}.modal-chips .mchip.on{background:var(--braise);border-color:var(--braise);color:#fff}
.modal-submit{width:100%;padding:14px;border:none;border-radius:12px;background:var(--braise);color:#fff;font-family:'DM Serif Display',serif;font-size:15px;cursor:pointer;transition:transform .15s;min-height:48px;margin-top:4px}.modal-submit:active{transform:scale(.97)}.modal-submit:disabled{opacity:.5}
.modal-toast{position:fixed;bottom:80px;left:16px;right:16px;padding:14px;border-radius:12px;font-family:'Cormorant Garamond',serif;font-size:14px;text-align:center;color:#fff;transform:translateY(40px);opacity:0;transition:all .3s;z-index:400;pointer-events:none}.modal-toast.ok{background:#4E7A65}.modal-toast.err{background:var(--braise)}.modal-toast.show{transform:translateY(0);opacity:1}
.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border)}
.logo-banner{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;border-bottom:1px solid var(--border);cursor:pointer}
.header-logo{height:64px;width:auto;object-fit:contain}
.menu-hint{font-size:12px;color:var(--braise);font-style:italic;letter-spacing:.05em;white-space:nowrap}
.header-mid{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px}
.app-title{font-family:'DM Serif Display',serif;font-size:18px;color:#F0EBE3;letter-spacing:.02em}
.app-sub{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.count{font-size:11px;color:var(--muted);letter-spacing:.05em}
.count span{color:var(--braise);font-weight:600}
.search-wrap{position:relative;padding:0 16px 12px}
.search-input{width:100%;background:#181818!important;border:1px solid var(--border);border-radius:12px;padding:10px 36px 10px 38px;font-family:'Cormorant Garamond',serif;font-size:16px;color:#F0EBE3!important;outline:none;-webkit-appearance:none}
.search-input::placeholder{color:var(--muted)!important;font-style:italic}
.search-input:focus{border-color:var(--braise);box-shadow:0 0 0 3px rgba(194,89,24,.2)}
.si{position:absolute;left:28px;top:50%;transform:translateY(-60%);color:var(--muted);pointer-events:none}
.clr{position:absolute;right:26px;top:50%;transform:translateY(-60%);background:var(--s3);border:none;border-radius:50%;width:22px;height:22px;color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:11px}
.clr.on{display:flex}
.filters{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;background:var(--bg)!important}
.filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:#181818!important;border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--sub);cursor:pointer;transition:all .18s;white-space:nowrap}
.chip.on.br{background:var(--braise)!important;border-color:var(--braise);color:#fff;font-weight:600}
.chip.on.am{background:var(--amethyste)!important;border-color:var(--amethyste);color:#fff;font-weight:600}
.rbar{padding:8px 16px;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--bg)!important}
.list{list-style:none;background:var(--bg)!important}
.si-item{border-bottom:1px solid var(--border);background:var(--bg)!important}
.si-top{display:flex;align-items:flex-start;gap:10px;padding:12px 16px 10px;cursor:pointer;background:var(--bg)!important}
.si-top:active{background:#181818!important}
.lang{flex-shrink:0;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px}
.lE{background:rgba(194,89,24,.15);color:var(--braise)}
.lF{background:rgba(90,32,144,.18);color:#8B5CF6}
.lI{background:rgba(34,197,94,.12);color:#4ADE80}
.si-info{flex:1;min-width:0}
.si-name{font-family:'DM Serif Display',serif;font-size:15px;color:#F0EBE3!important;line-height:1.25;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-artist{font-size:13px;color:var(--sub)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px;font-style:italic}
.si-tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tag{font-size:10.5px;padding:2px 7px;border-radius:10px;font-family:'Cormorant Garamond',serif}
.td{background:rgba(255,255,255,.06);color:var(--sub)}
.ti{color:var(--muted);font-style:italic}
.tb{color:var(--muted);font-size:10px}
.chev{flex-shrink:0;color:var(--muted);transition:transform .2s;margin-top:2px}
.si-item.open .chev{transform:rotate(180deg)}
.si-actions{overflow:hidden;max-height:0;opacity:0;transition:max-height 200ms ease,opacity 150ms ease;background:#181818!important}
.si-item.open .si-actions{max-height:200px;opacity:1}
.act-inner{padding:10px 16px 14px}
.ki{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kb{background:#222!important;border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--sub);font-family:'Cormorant Garamond',serif}
.kb strong{color:#F0EBE3;font-weight:600}
.capo{background:rgba(194,89,24,.12);border:1px solid rgba(194,89,24,.25);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--braise);font-family:'Cormorant Garamond',serif}
.abtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abtn{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 10px;border-radius:12px;border:none;cursor:pointer;font-family:'DM Serif Display',serif;font-size:14px;color:#fff;transition:transform .15s,filter .15s;line-height:1}
.abtn:active{transform:scale(.97)}
.bge{background:var(--euca,#4E7A65);grid-column:1/-1;padding:14px 10px;font-size:15px}
.bsp{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15)}.light .bsp,.light .bdz{background:rgba(44,36,22,.07);border-color:rgba(44,36,22,.15);color:var(--text)}
.bdz{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15)}
.bjr{background:var(--amethyste);grid-column:1/-1}
.empty{text-align:center;padding:60px 20px;color:var(--muted);background:var(--bg)!important}
.empty-t{font-family:'DM Serif Display',serif;font-size:20px;color:var(--sub);margin-bottom:6px}
mark{background:rgba(194,89,24,.35);color:var(--braise);border-radius:2px;padding:0 1px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
.setlist-btn{display:block;width:calc(100% - 32px);margin:8px 16px 12px;padding:14px;background:var(--braise);color:#fff;border:none;border-radius:14px;font-family:'DM Serif Display',serif;font-size:16px;cursor:pointer;text-align:center;transition:transform .15s;box-shadow:0 4px 16px rgba(194,89,24,.35)}
.setlist-btn:active{transform:scale(.97)}
.setlist-btn .sl-meta{font-family:'Cormorant Garamond',serif;font-size:12px;opacity:.85;margin-top:2px}
.setlist-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;overflow-y:auto;-webkit-overflow-scrolling:touch}
.setlist-overlay.open{display:block}
.setlist-header{position:sticky;top:0;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;z-index:301}
.setlist-back{background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;padding:4px;min-width:36px;min-height:36px}
.setlist-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--text)}
#setlistProgress{margin-left:auto;font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--sub);transition:opacity .15s}
#wakeLockBtn{background:none;border:none;font-size:20px;opacity:.4;transition:opacity .2s;min-width:36px;min-height:36px;color:var(--text);cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
#wakeLockBtn.active{opacity:1}
.setlist-num{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--braise);color:#fff;font-size:13px;font-weight:700;flex-shrink:0;margin-right:8px}
.setlist-divider{list-style:none;padding:18px 16px 8px;font-family:'DM Serif Display',serif;font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.12em;border-top:1px solid var(--border);margin-top:8px}
.setlist-nav{display:flex;gap:8px;margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
.setlist-nav .snav{flex:1;height:44px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--sub);font-family:'Cormorant Garamond',serif;font-size:14px;cursor:pointer;transition:opacity .15s,background .15s;-webkit-tap-highlight-color:transparent}
.setlist-nav .snav:active{background:var(--s2)}
.setlist-nav .snav[disabled]{opacity:.3;pointer-events:none;cursor:default}
.lyrics-overlay{display:none;position:fixed;inset:0;background:#0A0A0A;z-index:400;overflow-y:auto;-webkit-overflow-scrolling:touch;flex-direction:column}
.lyrics-overlay.open{display:flex}
.lyrics-header{position:sticky;top:0;background:#0A0A0A;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px;z-index:401}
.lyrics-back{background:none;border:none;color:#EAE3CE;font-size:22px;cursor:pointer;min-width:32px;min-height:44px}
.lyrics-meta{flex:1;min-width:0}
.lyrics-title{font-family:'DM Serif Display',serif;font-size:15px;color:#EAE3CE;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyrics-artist{font-size:13px;color:#8A7B6A;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyrics-body{padding:16px;flex:1;transform-origin:top center;transition:none}
.lyrics-section-label{font-size:12px;color:#C25918;letter-spacing:0.12em;text-transform:uppercase;margin:20px 0 8px;font-family:'Cormorant Garamond',serif}
.lyrics-line{font-family:'DM Serif Display',serif;font-size:19px;color:#EAE3CE;line-height:1.8;margin:0}
.lyrics-watermark{margin-top:32px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06);text-align:center;font-size:10px;color:#4A3E2E;letter-spacing:0.1em;padding-bottom:32px;font-family:'Cormorant Garamond',serif}
#lyricsProgress{position:sticky;top:0;height:3px;background:rgba(255,255,255,0.08);z-index:402}
#lyricsProgressBar{height:100%;width:0%;background:#C25918;transition:width 80ms linear}
#lyricsNextChip{display:none;font-size:13px;color:#C25918;border:1px solid rgba(194,89,24,0.3);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;-webkit-tap-highlight-color:transparent}
#lyricsNextChip.visible{display:block}
#lyricsControls{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:16px;display:flex;flex-direction:column;gap:8px;z-index:410}
#lyricsControls button{width:44px;height:44px;border-radius:50%;background:#1A1A1A;border:1px solid rgba(255,255,255,0.12);color:#EAE3CE;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
.lyrics-overlay.light #lyricsControls button{background:#D8D0BA;border-color:rgba(44,36,22,0.2);color:#2C2416}
.lyrics-overlay.light{background:#EAE3CE}
.lyrics-overlay.light .lyrics-header{background:#EAE3CE;border-bottom-color:rgba(44,36,22,0.12)}
.lyrics-overlay.light .lyrics-title{color:#2C2416}
.lyrics-overlay.light .lyrics-artist{color:#6B5E4E}
.lyrics-overlay.light .lyrics-back{color:#2C2416}
.lyrics-overlay.light #lyricsProgress{background:rgba(44,36,22,0.1)}
.lyrics-overlay.light .lyrics-body{background:#EAE3CE}
.lyrics-overlay.light .lyrics-line{color:#2C2416}
.lyrics-overlay.light .lyrics-section-label{color:#C25918}
.lyrics-overlay.light .lyrics-watermark{color:#8A7B6A;border-top-color:rgba(44,36,22,0.1)}
</style>

const S=[{"n":"Une belle histoire","a":"Michel Fugain;Le Big Bazar","l":"F","i":"P","d":1,"b":"166","t":"La Mineur","c":"","paroles":"C'est un beau roman\nC'est une belle histoire\nC'est une romance d'aujourd'hui\nIl rentrait chez lui, là-haut vers le brouillard\nElle descendait dans le Midi, le Midi\nIls se sont trouvés au bord du chemin\nSur l'autoroute des vacances\nC'était sans doute un jour de chance\nIls avaient le ciel à portée de main\nUn cadeau de la Providence\nAlors, pourquoi penser au lendemain\nIls se sont cachés dans un grand champ de blé\nSe laissant porter par le courant\nSe sont raconté leurs vies qui commençaient\nIls n'étaient encore que des enfants, des enfants\nQui s'étaient trouvés au bord du chemin\nSur l'autoroute des vacances\nC'était sans doute un jour de chance\nQui cueillirent le ciel au creux de leurs mains\nComme on cueille la Providence\nRefusant de penser au lendemain\n\nC'est un beau roman\nC'est une belle histoire\nC'est une romance d'aujourd'hui\nIl rentrait chez lui, là-haut vers le brouillard\nElle descendait dans le Midi, le Midi\nIls se sont quittés au bord du matin\nSur l'autoroute des vacances\nC'était fini le jour de chance\nIls reprirent alors chacun leur chemin\nSaluérent la Providence\nEn se faisant un signe de la main\nIl rentra chez lui, là-haut vers le brouillard\nElle est descendue là-bas dans le Midi\nC'est un beau roman\nC'est une belle histoire\nC'est une romance d'aujourd'hui"},{"n":"Ella, elle l'a","a":"France Gall","l":"F","i":"P","d":1,"b":"100","t":"Mi Mineur","c":"","paroles":"C'est comme une gaieté, comme un sourire\nQuelque chose dans la voix\nQui paraît nous dire « Viens ! »\nQui nous fait sentir étrangement bien\nC'est comme toute l'histoire du peuple noir\nQui se balance entre l'amour et l'désespoir\nQuelque chose qui danse en toi\nSi tu l'as, tu l'as\n\nElla, elle l'a, Ella, elle l'a\nCe je n'sais quoi\nQue d'autres n'ont pas\nQui nous met dans un drôle d'état\nElla, elle l'a, Ella, elle l'a\nCette drôle de voix\nCette drôle de joie\nCe don du ciel qui la rend belle\nElla, Ella, Ella, elle l'a\nElla, Ella, Ella, elle l'a\n\nCe tout petit supplément d'âme\nCet indéfinissable charme\nCette petite flamme\nTape sur des tonneaux, sur des pianos\nSur tout ce que Dieu peut te mettre entre les mains\nMontre ton rire ou ton chagrin\nMais que tu n'aies rien, que tu sois roi\nQue tu cherches encore les pouvoirs qui dorment en toi\nTu vois, ça ne s'achète pas\nQuand tu l'as, tu l'as\n\nElla, elle l'a\nCe je ne sais quoi\nQue d'autres n'ont pas\nQui nous met dans un drôle d'état\nElla, elle l'a, Ella, elle l'a\nCette drôle de voix\nCette drôle de joie\nCe donne du ciel qui la rend belle\nElla, Ella, Ella, elle l'a\nElla, Ella, Ella, elle l'a"},{"n":"Tout le bonheur du monde","a":"Sinsémilia","l":"F","i":"G","d":1,"b":"100","t":"Ré Mineur","c":"","paroles":"On vous souhaite tout le bonheur du monde\nEt que quelqu'un vous tende la main\nQue votre chemin évite les bombes\nQu'il mène vers de calmes jardins\nOn vous souhaite tout le bonheur du monde\nPour aujourd'hui comme pour demain\nQue votre soleil éclaircisse l'ombre\nQu'il brille d'amour au quotidien\n\nPuisque l'avenir vous appartient\nPuisqu'on n'contrôle pas votre destin\nQue votre envol est pour demain\nComme tout c'qu'on a à vous offrir\nNe saurait toujours vous suffire\nDans cette liberté à venir\nPuisqu'on n'sera pas toujours là\nComme on le fut aux premiers pas\n\nOn vous souhaite tout le bonheur du monde\nEt que quelqu'un vous tende la main\nQue votre chemin évite les bombes\nQu'il mène vers de calmes jardins\nOn vous souhaite tout le bonheur du monde\nPour aujourd'hui comme pour demain\nQue votre soleil éclaircisse l'ombre\nQu'il brille d'amour au quotidien\n\nToute une vie s'offre devant vous\nTant de rêves à vivre jusqu'au bout\nSûrement tant de joie au rendez-vous\nLibres de faire vos propres choix\nDe choisir quelle sera votre voie\nEt où celle-ci vous emmènera\nJ'espère juste que vous prendrez le temps\nDe prof nLe soleil les assomme\nFait monter leur peine\nOui tu sais les lionnes\nSont vraiment, vraiment des reines\n\nPorte l'eau, porte la vie\nTu dois courber le dos pour un peu de pluie\nC'est de l'or entre tes mains\nChaque jour qui passe fait la terre plus lasse\n\nMais tu sais les lionnes\nSont vraiment des reines\nLeur amour elles le donnent\nEt plus jamais ne le reprennent\nLe soleil les assomme\nFait monter leur peine\nOui tu sais les lionnes\nSont vraiment, vraiment des reines\n\nC'est l'espoir qui revient\nC'est la vie qu'elles ramènent\nDans leur sceaux bien pleins\nFatiguées mais toujours sereines\nDe la terre et des hommes\nElles sont les gardiennes\nOui tu sais les lionnes\nSont vraiment, vraiment des reines\n\nOui tu sais les lionnes, sont vraiment, vraiment des reines\nOui tu sais les lionnes, sont vraiment, vraiment des reines"},{"n":"La Vie en rose","a":"Édith Piaf","l":"F","i":"P","d":1,"b":"82","t":"Sol Mineur","c":"","paroles":"Des yeux qui font baisser les miens\nUn rire qui se perd sur sa bouche\nVoilà le portrait sans retouche\nDe l'homme auquel j'appartiens\n\nQuand il me prend dans ses bras\nQu'il me parle tout bas\nJe vois la vie en rose\nIl me dit des mots d'amour\nDes mots de tous les jours\nEt ça m'fait quelque chose\nIl est entré dans mon cœur\nUne part de bonheur\nDont je connais la cause\nC'est lui pour moi, moi pour lui dans la vie\nIl me l'a dit, l'a juré pour la vie\nEt dès que je l'aperçois\nAlors, je sens dans moi\nMon cœur qui bat\n\nDes nuits d'amour à plus finir\nUn grand bonheur qui prend sa place\nDes ennuis, des chagrins s'effacent\nHeureux, heureux à en mourir\n\nQuand il me prend dans ses bras\nQu'il me parle tout bas\nJe vois la vie en rose\nIl me dit des mots d'amour\nDes mots de tous les jours\nEt ça m'fait quelque chose\nIl est entré dans mon cœur\nUne part de bonheur\nDont je connais la cause\nC'est toi pour moi, moi pour toi dans la vie\nTu me l'as dit, m'as juré pour la vie\nEt, dès que je t'aperçois\nAlors, je sens dans moi\nMon cœur qui bat\n\nLa-la, la-la, la-la\nLa-la-la, la-la-la\nLa, la, la, la"},{"n":"Une seule vie (Marcher dans le sable)","a":"De Palmas","l":"F","i":"P","d":1,"b":"101","t":"Do Majeur","c":"","paroles":"Marcher dans le sable\nSe sentir coupable\nDans les herbes hautes\nC'est sûr tout est de ma faute\nSavoir dire tant pis\nAvoir juste envie\nRester dans son lit\nTout ça m'est interdit\n\nOh ! Il faut que quelqu'un m'aide\nJe n'ai qu'une seule vie\nTrouver le remède\nJe n'ai qu'une seule vie\nChaque jour cette pensée m'obsède\nJe n'ai qu'une seule, qu'une seule vie\n\nFaire comme tout le monde\nEntrer dans la ronde\nSurtout pas de vagues\nD'ici personne ne s'évade\n\nOh! Il faut que quelqu'un m'aide\nJe n'ai qu'une seule vie\nTrouver le remède\nJe n'ai qu'une seule vie\nChaque jour cette pensée m'obsède\nJe n'ai qu'une seule, qu'une seule vie\n\nInquiet, soucieux, honnête jour et nuit\nVoilà ce qu'est devenue ma vie\nx2\nOh! Il faut que quelqu'un m'aide\nJe n'ai qu'une seule vie\nTrouver le remède\nJe n'ai qu'une seule vie\nChaque jour cette pensée m'obsède\nJe n'ai qu'une seule, qu'une seule vie"},{"n":"La corrida","a":"Francis Cabrel","l":"F","i":"G","d":1,"b":"99","t":"Fa Majeur","c":"Capo 1 (E)","paroles":"Depuis le temps que je patiente dans cette chambre noire\nJ'entends qu'on s'amuse et qu'on chante au bout du couloir ;\nQuelqu'un a touché le verrou et j'ai plongé vers le grand jour\nJ'ai vu les fanfares, les barrières et les gens autour\n\nDans les premiers moments j'ai cru qu'il fallait seulement se défendre\nMais cette place est sans issue je commence à comprendre\nIls ont refermé derrière moi, ils ont eu peur que je recule\nJe vais bien finir par l'avoir cette danseuse ridicule\n\nEst-ce que ce monde est sérieux ?\nEst-ce que ce monde est sérieux ?\n\nAndalousie, je me souviens les prairies bordées de cactus\nJe ne vais pas trembler devant ce pantin, ce minus !\nJe vais l'attraper, lui et son chapeau, les faire tourner comme un soleil\nCe soir la femme du torero dormira sur ses deux oreilles\n\nEst-ce que ce monde est sérieux ?\nEst-ce que ce monde est sérieux ?\n\nJ'en ai poursuivi des fantômes, presque touché leurs ballerines\nIls ont frappé fort dans mon cou pour que je m'incline\nIls sortent d'où ces acrobates avec leurs costumes de papier ?\nJ'ai jamais appris à me battre contre des poupées\n\nSentir le sable sous ma tête, c'est fou comme ça peut faire du bien\nJ'ai prié pour que tout s'arrête, Andalousie, je me souviens\nJe les entends rire comme je râle, je les vois danser comme je succombe\nJe pensais pas qu'on puisse autant s'amuser autour d'une tombe\n\nEst-ce que ce monde est sérieux ?\nEst-ce que ce monde est sérieux ?\n\nSi, si hombre, hombre\nBaila, baila\nHay que bailar de nuevo\nY mataremos otros\nOtras vidas, otros toros\nY mataremos otros\nVenga, venga a bailar\nY mataremos otros"},{"n":"Sensualité","a":"Axelle Red","l":"F","i":"P","d":1,"b":"96","t":"Fa# Majeur","c":"","paroles":"Jamais je n'aurais pensé\nTant besoin de lui\nJe me sens si envoutée\nQue ma maman me dit : ralentis\nDésir ou amour\nTu le sauras un jour\n\nJ'aime, j'aime\nTes yeux, j'aime ton odeur\nTous tes gestes en douceur\nLentement dirigés\nSensualité\nHou ! Stop un instant\nJ'aimerais que ce moment\nFixe pour des tas d'années\nTa sensualité\n\nIl paraît qu'après quelques temps\nLa passion s'affaiblit\nPas toujours apparemment\nEt maman m'avait dit : ralentis\nDésir ou amour\nTu le sauras un jour\n\nJ'aime, j'aime\nTes yeux, j'aime ton odeur\nTous tes gestes en douceur\nLentement dirigés\nSensualité\nHou ! Stop un instant\nJ'aimerais que ce moment\nFixe pour des tas d'années\nTa sensualité\n\nJe te demande si simplement\nNe fais pas semblant\nJe t'aimerai encore\nEt encore\nDésir ou amour\nTu le sauras un jour\n\nJ'aime, j'aime\nTes yeux, j'aime ton odeur\nTous tes gestes en douceur\nLentement dirigés\nSensualité\nHou ! Stop un instant\nJ'aimerais que ce moment\nFixe pour des tas d'années\nTa sensualité\nTes yeux, j'aime t ison s'achève"},{"n":"La symphonie des éclairs","a":"Zaho de Sagazan","l":"F","i":"P","d":1,"b":"100","t":"Sol# Majeur","c":"","paroles":"Il fait toujours beau au-dessus des nuages\nMais moi, si j'étais un oiseau, j’irais danser sous l'orage\nJe traverserais les nuages comme le fait la lumière\nJ'écouterais sous la pluie la symphonie des éclairs\n\nDès sa plus tendre enfance, elle ne savait pas\nParler autrement qu’en criant tout bas\nPas faute d'essayer de les retenir\nCes cris et ces larmes qui les faisaient tant…\n\nIl fait toujours beau au-dessus des nuages\nMais moi, si j'étais un oiseau, j'irais danser sous l'orage\nJe traverserais les nuages comme le fait la lumière\nJ'écouterais sous la pluie la symphonie des éclairs\n\nEn grandissant rien ne s'est calmé\nPetite tempête s'est trouvée\nDes raisons de pleuvoir autant\nQui pourrait l’aimer franchement ?\nPersonne n’aimerait se retrouver\nAu cœur d'une tempête, avouez\nIl y a des raisons de pleurer\nElle a ses raisons, mais...\n\nIl fait toujours beau au-dessus des nuages\nMais moi, si j’étais un oiseau, j'irais danser sous l'orage\nJe traverserais les nuages comme le fait la lumière\nJ'écouterais sous la pluie la symphonie des éclairs\n\nQuand la tempête a su\nQue des mélodies\nPouvaient s’échapper du vent\nEt se retrouver\nDans les cœurs des gens\nCelle-ci s'est dit\nNulle raison d'envier le soleil\nJe ferai danser les gens\nAu rythme de mes pleurs\nLa tourmente de mes chants\nViendra réchauffer les cœurs\nRéchauffer mon cœur\n\nIl fait toujours beau au-dessus des nuages\nMais moi, je suis de ces oiseaux qui nous font danser sous l'orage\nJe traverserai tous les nuages pour trouver la lumière\nEn chantant sous la pluie la symphonie des éclairs"},{"n":"Tout savoir","a":"Adé","l":"F","i":"P","d":1,"b":"96","t":"Si Mineur","c":"","paroles":"Tes ch'veux ont poussé, je vois\nQue ta tête a changé\nJe t'aime plus qu'avant je crois\nT'as le sourire cassé\n\nJ'me dirais à moi-même\nQue si j'me r'connais pas\nQue si je ds plein de balles résonner\nJe vais faire ens sorte de vous expliquer pourquoi maintenant j’ai plus peur, pourquoi j’ai décidé de me battre quand je vois le succès s’approcher, pourquoi j’ai l’impression qu’être seule devient beaucoup trop vital\nJ’aimerais vous faire comprendre ce qu’il se passe derrière la baie vitrée\nMoi je fais du rap car au départ ça m’apaise, pas pour la fame, jamais je me suis dit qu’un jour c’était possible que les grands m’appellent\nJe suis insouciante c’est ma passion mais je sais pas trop m’insérer\nJe suis même choquée que certains rappeurs m’accordent de l’intérêt\nÇa me donne la force de gauche à droite je me dis qu’il y a quelque chose à faire\nÇa parle contrat sans trop de papier mais ça parle plus manager\nToujours en cours donc à côté je me pose beaucoup de questions\nLe prof me parle mais dans ma tête je pense à la prochaine session\nIl y a beaucoup de monde j’aime bien les gens mais j’ai ce côté discret\nMon subconscient me dit que face aux rappeurs faut pas que je me disperse\nDans mon cerveau toujours une alerte qui fait sonner le bipper\nSi je souris c’est peut-être qu’au fond je veux cacher toute ma tristesse\nFaut peut-être le vivre pour le comprendre mais l’énergie c’est précieux\nLes gens nocifs qui t’entourent sont toujours ceux que tu apprécieras\nJe suis noire je rappe et je suis une femme donc je suis toujours sous pression\nC’est complexe quand je te répète que je veux montrer que j’existe\nSois pas trop femme sois pas trop mec mon cerveau pète un câble\nSois la petite sœur du quartier pour qu’on se concentre sur ton rap\nC’est trop moulant ce que tu veux mettre mais c’est toi qui fais ton choix\nDes mecs dans le studio c’est sûr que la racli passe sous la table\nJ’aime bien son flow mais c’est une meuf donc je peux pas trop valider\nTu as pas de vécu tu veux raconter quoi, faut juste s'exhiber\nJ’évite de regarder les commentaires qui pourraient m’irriter\nMes rappeurs préférés me valident je me demande si je le mérite\nJe vis des trucs oufs pas l’impression que c’est le moment présent\nJ’entends des échos sur ma personne sans avoir mis de réverbe\nPersonne n’est capable de savoir ce que mon petit cœur ressent\nJ’ai pas de (mitaï ?) mais tous les soirs je ne fais que goûter le revers\nC’est sûr qu’ils pensent tous intérêt\nL’insouciance c’est la seule chose avec le temps\nSusceptible d’avoir le pouvoir de m’enterrer\nJ’ai pas pu tâter le terrain mais j’ai compris qu’avoir la balle pour marquer le but nécessiter d’avoir un mental terrible\nC’est qu’à nos risques et périls\nOuais il y a qu’un pas entre la volonté d’être sois-même ou le devoir de goûter à la dérive\nToi c’est peut-être ton manque d’estime qui fait en sorte que tu préfères croquer la pomme sans même savoir si ça portera ses fruits\nLes gens mauvais c’est réel\nIl y a des personnes qui peuvent te haïr car tu as la force et le courage de pouvoir croire en tes rêves\nSans effets Dieu nous préserve\nJe suis pas mauvaise je suis pas parfaite mais ce qui est sûr c’est que je crains toutes les choses qu’ils me réservent\nJ’arrête les cours, je reprends les cours et je côtoie quelques équipes\nToujours le même scénario de fin\nJe prends mes claques/clacs et mes cliques/clics\nJ’ai l’impression qu’ils ne se rendent pas compte à quel point c’est complexe\nDes fois je n’avais plus de cœur donc je me devais de rapper qu’avec mes tripes\nIl faut penser sentiments, si tu donnes pas ton (terma ?) il y en a qui sont capables de te dire d’aller te faire voir gentiment\nMoi j’ai gardé cette innocence et j’ai compris qu’au lieu de montrer mon boule, pour faire la diff fallait que je montre plus que ma force\nDonc j’ai l’impression que ça ne va jamais se finir\nJ’ai 24 ans, à 30 ans toujours sur contrat si j’avais signé\nIls veulent que je me résigne mais je ne veux pas sortir de single\nIl y a des zones d’ombre donc constamment je préfère éteindre la lumière\nDes messages et des appels qui jouent sur mon humeur\nÇa fait mal quand tu donnes tout mais qu’on te repoche de pas mettre du tien\nJ’ai toujours dit que la réussite serait pour qui la veut\nLes personnes avec qui tu marches seront la personne que tu deviens\nEt si tu coules avec les autres saches que tu auras toujours le choix de nager jusqu’à la rive pour essayer de sortir du bateau\nDonner ses rêves à quelqu’un d’autre c’est prendre le risque qu’il les piétine et qu’il aille dire à la terre entière que c’est que de ta faute\nMoi il y a pleins de sons qui ne verront jamais le jour car même mon corps me disait que je ne pouvais pas me permettre de tendre la joue\nQue des langages de sourds, dans le néant ce que j’espérais au plus profond de mon âme c’est que Leys et Leslie se retrouvent\nJe suis parano il me faut un 9 pour tous ces gens qui font des nœuds\nDans les embrouilles les personnes les plus hypocrites feront les neutres\nEt combien de fois j’ai craché ma peine dans mes textes pour aller mieux\nJ’ai pleuré plein de fois mais je me suis jamais dit la c’est trop pour moi\nJe remets à Dieu les choses qui me mettent dans l’attente\nC’est fou j’ai l’impression de marcher avec un gun (planté ?) sur la tempe\nIls ont pas tort les absents c’est juste qu’ils ont compris que c’est pas les autres qui leur donneront de la force\nJe parle de choses qui me brisent, il faut que je vous parle de ma mère\nC’est pas de l’amour c’est beaucoup plus, je donnerais ma vie pour la sienne\nJ’espère qu’un jour tu puisses lui dire que tes blessures se referment\nJe sais tu seras toujours là piur moi si l’étau se resserre\nMais dans un monde aussi cruel c’est les promesses qui m’oppressent\nC’est des actions qui nous sauvent pendant que c’est des proches qui nous blessent\nInconsciemment dans la tourmente c’est mes démons qui me bercent\nJe crois que je suis la seule qui ne se demande pas « Leslie quand est-ce que tu perces ? »\nLa clairvoyance de me rendre compte que le buzz n’est pas gage de réussite\nLa lumière ramène de l’ombre dans laquelle certains se sont suicidés\nParfois je regarde et je me pose la question si j’hallucine\nLa couleur de leur âme qui m’empêche pour toujours de les jalouser\nJe connais des gens qui ne se remettent jamais en question\nJ’ai fait l’erreur de mélanger la musique avec le perso\nJamais je me justifie quand la personne ne croit qu’une seule version\nTu me parles de gens que je ne connais pas qui m’ont pris pour leur adversaire\nJ’ai même plus le cœur à vous haïr je veux juste miser sur moi-même\nJe ne vais pas signer car être en cage j’ai l’impression que c’est la même\nJe connais des gens qui peuvent prendre ton énergie jusqu’à la moelle\nJe me jette à l’eau donc comme Calogero je suis face à la mer\nJe suis pas un braque mais je quitte la table quand mon instinct m’y pousse\nJe me sens légère depuis que j’ai compris qu’il ne me faut plus d’épaule\nEn tant qu’artiste il y a forcément une part de moi qui souffre, une part de moi qui s’ouvre, donc forcément des plans qui sautent\nJe fais des cauchemars de tous mes rêves et ça même quand je suis dans le meilleur\nJ’ai compris que j’étais le problème quand je faisais trop la même erreur\nJe me suis dit c’est la seule chose qui m’empêchera de vriller\nPour le bonheur je ne me concentre plsu à faire en sorte de chercher ma moitié\nIl y a des blessures indélébiles que je vais devoir maquiller\nLe cœur animé c’est pas mon âme que je vais déshabiller\nÀ quoi ça sert de donner son cœur si on peut s’oublier\nJe me dirige toujours vers ceux qui me font souffrir\nViolences affectives deviennent banales donc je me dirige vers ce borgne qui ne peut pas me donner que lui-même n’a jamais pû reconnaître\nIl a pas l’air d’être lui-même\nDu passé beaucoup de séquelles\nIl ne veut pas me laisser partir donc c’est mon cœur qu’il séquestre\nJe l’ai aimé de tout mon cœur sans percevoir qu’une partie de moi le déteste\nJe me demande si t’es sincère ou bien un simple prétexte\nJ’ai vu de mes yeux les seules personnes qui sont parties au front\nLes fous le savent (?) pendant nous faisons (?)\nJ’ai dû prendre pleins de décisions à contre-cœur\nMais je suis dans le doute et dans la certitude quand je fais les choses à contre-courant\nSur le papier c’était marqué qu’il faut plus que du courage\nLa partie sombre c’est quand tu vois le visage de ton entourage\nDes gens sans rêves qui te font connaître le goût du doute\nSi tu gagnes t’es la meilleure c’est quand tu perds qu’il n’y a plus (?)\nJ’ai compris le fond du problème (?)\nJe pense à demain alors qu’hier je te disais que je voyais plus le bout\nJe me prends des bâtons dans les pattes en même temps je dois éviter le trou\nLa pire des choses c’est s’entourer sans même savoir vous allez où\nMême quand c’est dur on coupe les ponts surtout quand le cœur n’y est plus\nMême dans les daux j’ai fait des bonds même dans les vrais je ne me reconnais plus\nJ’ai pas confiance en l’être humain qui pour gagner peut faire de la suce\nJ’ai moins confiance en l’être aimé qu’en la personne qui (casse sa puce ?)\nComment se termine le film ?\nEst-ce que mes doutes et mes humeurs feront en sorte que je me résigne à vouloir changer les mœurs ?\nPour mon rap j’ai de l’estime\nDonc je me concentre plutôt que de me mettre dans une relation qui finira en partage de meubles\nJ’ai même pas suivi la meute\nEt peu importe ce que tu proposes, mon mental s’est forgé pour suivre uniquement les ordres que l’instinct m’a donné\nSi hier je t’ai tourné le dos bah aujourd’hui je ne pense plus à toi\nC’est comme sin inconsciemment mon esprit t’avait pardonné\nBesoin de sérénité parce que je n’aime pas l’emprise des promesses\nBesoin de vérité parce que des fois je suis peut-être malhonnête\nBesoin de personnes qui me détestent sans même pas me connaître\nBesoin de réaliser tous les plans que j’ai fait sur la comète\nBesoin que la tombe de ma grand-mère reflète ce qu’elle a pû être\nBesoin de rendre à ma mère toute l’énergie qu’elle a pû mettre\nTu vois au fond de mes prunelles que tu peux mettre tous les obstacles\nJe suis le genre de femme qui verra toujours à la fin du tunnel\nBesoin de toi, besoin de moi, besoin de eux\nBesoin du mal et du bien\nEn fait j’ai trop besoin d’aide\nBesoin de briser les codes du rap pour enfin me dire que je vais mieux\nBesoin de montrer qu’une femme est forte et en même temps sensible\nBesoin d’être moi-même jusqu’au bout sans devoir mettre des barrières\nBesoin que les gens arrêtent de parler uniquement du paraître\nJe reçois des messages de personnes qui avant ne m’auraient pas rép\nBesoin de leur dire que je les fuck\nIl faut qu’ils aillent voir ailleurs\nMais être une femme qui fait du rap c’est déjà une prise de position\nMoi je représente toute origine qui s’empare de ma vision\nÀ les entendre faire les shows seule serait plus qu’impossible\nÇa tombe bien parce que l’impossible fait partie de la plupart des codes que nous brisons\nJ’entends des remarques misogynes venant de la gente féminine\nJe connais des hommes frustrés qui ne m’aiment pas parce que je les intimide\nMais c’est vers où je me dirige\nTu as peur du jour où tu vas comprendre que je vais enfin mettre la passe du siècle\nJ’aimerais remercier le doute\nJ’aimerais remercier la vie\nJ’aimerais remercier ceux qui me disaient qu’il faudra faire avec\nJe me suis posée la question : « est-ce que l’on est ce qu’on attire ? »\nQu’on me pardonne mais des péchés j’en ai beaucoup plus que sept\nJ’aimerais remercier mon ex quand il m’a dit qu’il partait\nJe sais qu’au fond cette relation était vouée à l’échec\nJ’aimerais remercier le rap pout tout ce qu’il m’a apporté\nOuais cette envie de briser les codes en même temps que de briser les chaînes\nJ’aimerais te donner de la force pour que tu puisses te relever\nJ’aimerais te dire que ta puissance ne vient qu’avec les blessures\nJ’aimerais te dire n’attends jamais des gens qui viennent te sauver\nLes pieds sur terre mais le reste de mes membres en apesanteur\nParfois je regarde le ciel en espérant qu’il m’envoie des signes\nAvec l’épée de Damoclès je fais tous les jours de l’escrime\nMoi je suis la rose les épines\nVos trahisons c’est des signes\nJe me sens vivante depuis que je me rends compte que c’est moi qui décide\nJ’ai encore pleins de choses à dire mais c’est la fin pour l’instant\nJ’ai pas l’habitude de vraiment parler des choses qui me brisent\nJ’aime beaucoup vous donner quand c’est fort et intense\nIl est temps maintenant que je referme le journal intime\nSi la vie venait me dire « il ne te reste que 20 minutes »\nMoi j’aurai prié à la mort et j’aurai rappé 10 minutes"},{"n":"Juste après","a":"Carole Fredericks;Jean-Jacques Goldman;Michael Jones","l":"F","i":"P","d":1,"b":"192","t":"Sol Majeur","c":""},{"n":"A nos actes manqués","a":"Carole Fredericks;Jean-Jacques Goldman;Michael Jones","l":"F","i":"P","d":1,"b":"111","t":"Mi Majeur","c":""},{"n":"Si facile","a":"Casseurs Flowters","l":"F","i":"A","d":1,"b":"97","t":"La# Majeur","c":"","paroles":"Si c'était si facile, tout le monde le ferait\nQui tu serais pour réussir où tous les autres ont échoué ?\nOublie tes rêves prétentieux, redescends sur terre\nOu tu n'en reviendras jamais\n\nMontre-leur que t'es fragile, tu tiens pas deux secondes\nBesoin de réconfort ? Lève-toi et tombe\nDemande à tes nouveaux potes, depuis que t'es au top, ils passent leur temps à te faire la courte échelle en rêvant qu'tu t'effondres\nTu vois pas qu'ils veulent être toi, même pour quelques secondes ?\nQu'ils rêvent de fame en priant pour que la tienne retombe ?\nTu seras du-per, toi qui rêvais d'être dans la lumière\nComme si c'est nous qu'allions te faire de l'ombre\nOuais, on est tes potes, mais bon, tu changes de cap\nTu nous mets sur la touche maintenant qu'tous ces gens te flattent\nJ'suis pas là pour critiquer ni t'apprendre le rap\nMais t'as retourné ta veste, tous les jours, tu changes de sapes\nDes sacrifices ? Tout c'qu'j'vois c'est qu'à force de prendre le cash, t'as dû prendre le large\nJ'espère que toute cette merde, ça va finir par te re tmartre en ce temps-là, accrochait ses lilas jusque sous nos fenêtres\nEt si l'humble garni, qui nous servait de nid ne payait pas de mine\nC'est là qu'on s'est connu, moi qui criais famine et toi qui posais nue\n\nLa bohème, la bohème\nÇa voulait dire on est heureux\nLa bohème, la bohème\nNous ne mangions qu'un jour sur deux\n\nDans les cafés voisins, nous étions quelques-uns qui attendions la gloire\nEt bien que miséreux, avec le ventre creux nous ne cessions d'y croire\nEt quand quelque bistrot, contre un bon repas chaud nous prenait une toile\nNous récitions des vers, groupés autour du poêle en oubliant l'hiver\n\nLa bohème, la bohème\nÇa voulait dire tu es jolie\nLa bohème, la bohème\nEt nous avions tous du génie\n\nSouvent il m'arrivait, devant mon chevalet de passer des nuits blanches\nRetouchant le dessin de la ligne d'un sein, du galbe d'une hanche\nEt ce n'est qu'au matin, qu'on s'asseyait enfin devant un café-crème\nÉpuisés mais ravis, fallait-il que l'on s'aime et qu'on aime la vie\n\nLa bohème, la bohème\nÇa voulait dire on a vingt ans\nLa bohème, la bohème\nEt nous vivions de l'air du temps\n\nQuand, au hasard des jours, je m'en vais faire un tour à mon ancienne adresse\nJe ne reconnais plus ni les murs, ni les rues qui ont vu ma jeunesse\nEn haut d'un escalier, je cherche l'atelier dont plus rien ne subsiste\nDans son nouveau décor, Montmartre semble triste et les lilas sont morts\n\nLa bohème, la bohème\nOn était jeunes, on était fous\nLa bohème, la bohème\nÇa ne veut plus rien dire du tout"},{"n":"Paradis Perdus","a":"Christine and the Queens","l":"F","i":"P","d":1,"b":"180","t":"Si Mineur","c":"","paroles":"Dans ma veste de soie rose\nJe déambule morose\nLe crépuscule est grandiose\n\nHeartless\nHow could you be so heartless?\nHow could you be so heartless?\nHow could you be so heartless?\n\nDandy un peu maudit, un peu vieilli\nDans ce luxe qui s'effondre\nTe souviens-tu quand je chantais\nDans les caves de Londres ?\nUn peu noyé dans la fumée\nCe ui se maquillent\nÇa fait rire les passants\nMais quand ils voient du sang sur nos lames de rasoir\n\nÇa fait, comme un éclair dans le brouillard\nQuand on arrive en ville\nNous, tout c'qu'on veut c'est être heureux\nÊtre heureux avant d'être vieux\nOn a pas l'temps, d'attendre d'avoir trente ans\nNous, tout c'qu'on veut c'est être heureux\nÊtre heureux avant d'être vieux\nOn prend tout c'qu'on peut mais en attendant\n\nQuand on arrive en ville\nOn arrive de nulle part\nOn vit sans domicile, on dort dans des hangars\n\nLe jour on est tranquille\nOn passe incognito\nLe soir on change de peau et on frappe au hasard\n\nAlors préparez vous pour la bagarre\nQuand on arrive en ville\n\nQuand la ville souterraine\nEst plongée dans le noir\nLes gens qui s'y promènent ressortent sur des brancards\n\nOn agit sans mobile\nÇa vous parait bizarre\nC'est p't'être qu'on est débile, c'est p't'être par désespoir\n\nDu moins, c'est ce que disent les journaux du soir\nQuand on arrive en ville\nNous, tout c'qu'on veut c'est être heureux\nÊtre heureux avant d'être vieux\nOn a pas l'temps d'attendre d'avoir trente ans\nNous tout ce qu'on veut c'est être heureux\nÊtre heureux avant d'être vieux\nOn prend tout ce qu'on peut en attendant\nQuand viendra l'an 2000, on aura quarante ans\nSi on vit pas maintenant, demain il sera trop tard\nQu'est-ce qu'on va faire ce soir\nOn va p'têt tout casser\nSi vous allez danser ne rentrez pas trop tard\nDe peur, qu'on égratigne vos Jaguars\nPréparez vous pour la bagarre\nC'est la panique sur les boulevards\nQuand on arrive en ville, yeah!\nAh!"},{"n":"Belle - «Notre Dame de Paris\"","a":"Daniel Lavoie;Garou;Patrick Fiori","l":"F","i":"P","d":1,"b":"82","t":"Ré# Majeur","c":"","paroles":"[Couplet 1 : Garou]\r\nBelle, c'est un mot qu'on dirait inventé pour elle\r\nQuand elle danse et qu'elle met son corps à jour\r\nTel un oiseau qui étend ses ailes pour s'envoler\r\nAlors je sens l'enfer s'ouvrir sous mes pieds\r\nJ'ai posé mes yeux sous sa robe de gitane\r\nA quoi me sert encore de prier Notre-Dame\r\nQuel est celui qui lui jettera la première pierre\r\nCelui-là ne mérite pas d'être sur terre\r\nÔ, Lucifer ! Ô, Laisse-moi rien qu'une fois\r\nGlisser mes doigts dans les cheveux d'Esmeralda\r\n\r\n[Couplet 2 : Daniel Lavoie]\r\nBelle, est-ce le diable qui s'est incarné en elle\r\nPour détourner mes yeux du Dieu éternel ?\r\nQui a mis dans mon être ce désir charnel\r\nPour m'empêcher de regarder vers le Ciel\r\nElle porte en elle le péché originel\r\nLa désirer fait-il de moi un criminel\r\nCelle qu'on prenait pour une fille de joie une fille de rien\r\nSemble soudain porter la croix du genre humain\r\nÔ, Notre-Dame ! Laisse-moi rien qu'une fois\r\nPousser la porte du jardin d'Esmeralda\r\n\r\n[Couplet 3 : Patrick Fiori]\r\nBelle, malgré ses grands yeux noirs qui vous ensorcellent\r\nLa demoiselle serait-elle encore pucelle\r\nQuand ses mouvements me font voir monts et merveilles\r\nSous son jupon aux couleurs de l'arc-en-ciel\r\nMa dulcinée laissez-moi vous être infidèle\r\nAvant de vous avoir menée jusqu'à l'autel\r\nQuel est l'homme qui détournerait son regard d'elle\r\nSous peine d'être changé en statue de sel\r\nÔ, Fleur-de-Lys ! Je ne suis pas homme de foi\r\nJ'irai cueillir la fleur d'amour d'Esmeralda\r\n\r\n[Couplet 4 : Ensemble]\r\nJ'ai posé mes yeux sous sa robe de gitane\r\nÀ quoi me sert encore de prier, Notre-Dame ?\r\nQuel est celui qui lui jettera la première pierre\r\nCelui-là ne mérite pas d'être sur terre\r\nÔ Lucifer ! Ô, laisse moi rien qu'une fois !\r\nGlisser mes doigts dans les cheveux d'Esmeralda\r\nEsmeralda"},{"n":"Sur la route","a":"De Palmas","l":"F","i":"P","d":1,"b":"110","t":"Mi Majeur","c":"","paroles":"Entre toute autre chose\nJ'aurais du m'arrêter faire une pause\nMais j'étais trop pressé\nN'aurait-on pas pu attendre un été\nErreur fatale\nJ'aurais du t'écouter\nJe ne dissociais plus le bien du mal\nCar j'étais sur la route\nToute la sainte journée\nJ'n'ai pas vu le doute en toi s'immiscer\nJ'étais sur la route\nToute la sainte journée\nSi seulement j'avais pu lire\nDans tes pensées\nJ'avais perdu l'habitude\nLe sentiment profond de solitude\nJe ne m'apercevais pas\nQue tu étais derrière chacun de mes pas\nErreur fatale\nVient le temps des regrets\nJe me noie dans un verre de larmes\nJ'étais sur la route\nToute la sainte journée\nJ'n'ai pas vu le doute en toi s'immiscer\nJ'étais sur la route\nToute la sainte journée\nSi seulement j'avais pu lire\nDans tes pensées\nJ'ai fait mon malheur\nCar j'étais sur la route\nToute la sainte journée\nJ'n'ai pas vu le doute en toi s'immiscer\nJ'étais sur la route\nToute la sainte journée\nSi seulement j'avais pu lire\nDans tes pensées\nSur la route\nToute la sainte journée\nJ'n'ai pas vu le doute en toi s'immiscer\nJ'étais sur la route\nToute la sainte journée\nSi seulement j'avais pu lire\nDans tes pensées\nOh baby\nJ'aurais vu le doute\nEn toi\nS'immiscer"},{"n":"Sur la route de Memphis","a":"Eddy Mitchell","l":"F","i":"P","d":1,"b":"116","t":"Mi Majeur","c":"","paroles":"J'écoutais le disc-jockey\nDans la voiture qui m'entrainait\nSur la route de Memphis\nSur la route de Memphis\nEt la radio me vantait\nUn truc débile qui m'endormait\nSur la route de Memphis\nSur la route de Memphis\nJe viens vers toi, tu m'attends dans ta robe blanche\nL'amour en province ressemble un peu à un dimanche\nSur le siège avant, le chauffeur\nBuvait de la bière en regardant l'heure\nSur la route de Memphis\nSur la route de Memphis\nA la place du mort, un chien-loup\nMe jetait un regard un peu fou\nSur la route de Memphis\nSur la route de Memphis\nJe viens vers toi, mais pas dans une Rolls blanche\nDans un costume un peu élimé aux manches\nJ'ai le droit de me taire et d'fumer\nEn gardant mes menottes aux poignets\nSur la route de Memphis\nSur la route de Memphis\nPour une fois les flics ont gagné\nVers chez toi je ne fais que passer\nSur la route de Memphis\nSur la route de Memphis\nSur la route de Memphis\nSur la route de Memphis..."},{"n":"LES HAUTES LUMIÈRES","a":"Fauve","l":"F","i":"P","d":1,"b":"84","t":"Fa Majeur","c":"","paroles":"Après la nuit\nAvant le jour\nEt à travers les roselières\nAprès la nuit\nAvant le jour\nJ'irai chercher les hautes lumières\n\nAux innocents les mains pleines\nJe t'emmène lancer les médailles\nDans l'eau bleue des fontaines\nEt cueillir à nouveau ces visions\nQu'on s'offrait autrefois comme des couronnes\nCes visions qu'on s'échangeait\nPour se dire, pour se rappeler\nJe suis veilleur, tu es musée\nJe veux sentir les feuilles de menthe craquer\nSous nos dents avec la chlorophylle qui s'échappe\nEt te faire écouter le son de carillon\nQue fait le claquement des drisses de pavillons contre les mâts\nAvec en fond le grand fracas de la mer qui rapporte\nEt au-dessus la procession d'cargots des nuages bas et blancs\nJ'voudrais te faire rencontrer les femmes cyprines et les vols queen\nQu'elles nous habillent de robes et de diadèmes\nAu croisement d’Amsterdam et de la 80ème\nPendant que moi j'te mettrai au poignet\nDes bracelets de tissus qui deviendront des bracelets de fleurs\nPuis des rubans, puis des violons\nJ'porte le blason de mon clan\nJe l'ai désormais gravé sur la face visible de mon cœur\nMais ça ne fait pas mal rassure toi au contraire\nJ'ai fait broder nos souvenirs étincelants sur deux manteaux de nuit\nQue m'ont offerts des frères tisserands, drapiers canuts\nJ'ai à la main mes haussières\nJe suis prêt\n\nAprès la nuit\nAvant le jour\nEt à travers les roselières\nAprès la nuit\nAvant le jour\nJe t'offrirai les hautes lumières\n\nAux innocents les mains pleines\nJe t'emmène plonger dans la Seine\nEt nager dans les courants forts de Beauchamp\nNager dans les rivières, remonter les ruisseaux\nPuis prendre un bain brûlant\nOù je laverai ta peau au lait d'ânesse\nAvant de sécher ton corps moi-même, comme avant\nQuand on était adolescents\nJe veux faire l'amour dans les champs\nDans les clairières, dans les taxis\nJe veux faire l'amour partout\nMême sur les toits de Paris\nJe veux résider au creux de ton cou\nEt dans tes draps parfumés au lilas\nTandis qu'une madre enveloppé d'un châle rouge\nBénit nos fronts en silence\nAvec des croix de baume au camphre\nJe te montrerai comment décrocher les boules blanches des symphorines\nPour les éclater sous nos pieds et entre nos doigts\nAvant d'aller regarder la lumière des lampadaires\nQui rougeoie et qui vacille sur les berges des fleuves endormis\nDont les risées de vent emplissent la surface\nJe veux offrir cette cigarette à ma mère\nCette cigarette d'après la guerre et son odeur vanillée\nJe t'emmène voir le granit rose de ces îles qu'on peut pas déplacer mais c'est pour nous protéger\nJe t'emmène tout rejouer, peut-être tout perdre\nMais peut-être aussi tout raffler, tout braquer, tout gagner\n\nAprès la nuit\nAvant le jour\nEt à travers les roselières\nAprès la nuit\nAvant le jour\nJe t'offrirai les hautes lumières\n\nAux innocents les mains pleines je t'emmène voir Tolède, Cavour, Sienne et Navonne\nToucher la faïence des rues de Lisbonne\nEt le marbre blanc lisse et brillant des palais\nJe veux entendre les salams des chauffeurs et qui nous crient\n\"Les enfants je vous emmène à Orléans si ça vous plaît\"\nJe veux t'offrir le tintement des couverts d'argent contre le cristal\nEt les mots précieux des miens\nJe veux écouter les histoires des anciens encore et encore\nCes histoires millénaires qui renaissent\nOn s'est connus y'a 3000 ans, on se retrouve maintenant\nEt nos enfants feront de même\nJ't'emmène loin des griffes de la colère, loin des regrets, loin des nausées\nJ't'emmène loin de la barbarie et des odeurs de kérosène brûlé\nJ't'emmène courir après des filles, après des garçons, après des rêves\nEt contempler les vivants\nCes gens qu'on croise parfois qui nous font tomber amoureux pour deux, pour trois\nOn doit encore parcourir la Terre\nOn doit trouver cent mille sœurs et cent mille frères\nPour plus jamais être seuls dans les cimetières\nAlors sur la colline du Palatin, par dessus les Dômes byzantins\nBientôt nous seront postés\nNous armerons nos flèches de diamants pour devenir sagittaires\nEt décrocher les hautes lumières\n\nAprès la nuit\nAvant le jour\nEt à travers les roselières\nAprès la nuit\nAvant le jour\nJe t'offrirai les hautes lumières\nAprès la nuit\nAvant le jour\nEt à travers les roselières\nAprès la nuit\nAvant le jour\nJe t'offrirai les hautes lumières"},{"n":"Savoir aimer","a":"Florent Pagny","l":"F","i":"P","d":1,"b":"138","t":"Fa# Mineur","c":"","paroles":"Savoir sourire\nÀ une inconnue qui passe\nN'en garder aucune trace\nSinon celle du plaisir\nSavoir aimer\nSans rien attendre en retour\nNi égard, ni grand amour\nPas même l'espoir d'être aimé\nMais savoir donner\nDonner sans reprendre\nNe rien faire qu'apprendre\nApprendre à aimer\nAimer sans attendre\nAimer à tout prendre\nApprendre à sourire\nRien que pour le geste\nSans vouloir le reste\nEt apprendre à vivre\nEt s'en aller\nSavoir attendre\nGoûter à ce plein bonheur\nQu'on vous donne comme par erreur\nTant on ne l'attendait plus\nSe voir y croire\nPour tromper la peur du vide\nAncrée comme autant de rides\nQui ternissent les miroirs\nSavoir donner\nDonner sans reprendre\nNe rien faire qu'apprendre\nApprendre à aimer\nAimer sans attendre\nAimer à tout prendre\nApprendre à sourire\nRien que pour le geste\nSans vouloir le reste\nEt apprendre à vivre\nEt s'en aller\nSavoir souffrir\nEn silence, sans murmure\nNi défense ni armure\nSouffrir à vouloir mourir\nEt se relever\nComme on renaît de ses cendres\nAvec tant d'amour à revendre\nQu'on tire un trait sur le passé\nMais savoir donner\nDonner sans reprendre\nNe rien faire qu'apprendre\nApprendre à aimer\nAimer sans attendre\nAimer à tout prendre\nApprendre à sourire\nRien que pour le geste\nSans vouloir le reste\nEt apprendre à vivre\nEt s'en aller\nApprendre à rêver\nÀ rêver pour deux\nRien qu'en fermant les yeux\nEt savoir donner\nDonner sans rature\nNi demi-mesure\nApprendre à rester\nVouloi ion","l":"F","i":"P","d":1,"b":"141","t":"Si Majeur","c":"","paroles":"Et si tu crois que j'ai eu peur, c'est faux\nJe donne des vacances à mon cœur, un peu de repos\nEt si tu crois que j'ai eu tort, attends\nRespire un peu le souffle d'or qui me pousse en avant\n\nEt fais comme si j'avais pris la mer\nJ'ai sorti la grand-voile et j'ai glissé sous le vent\nFais comme si je quittais la terre\nJ'ai trouvé mon étoile, je l'ai suivie un instant\nSous le vent\n\nEt si tu crois que c'est fini, jamais\nC'est juste une pause, un répit après les dangers\nEt si tu crois que je t'oublie, écoute\nOuvre ton port aux vents de la nuit, ferme les yeux\n\nEt fais comme si j'avais pris la mer\nJ'ai sorti la grand-voile et j'ai glissé sous le vent\nFais comme si je quittais la terre\nJ'ai trouvé mon étoile, je l'ai suivie un instant\nSous le vent\n\nEt si tu crois que c'est fini, jamais (Sous le vent)\nC'est juste une pause, un répit après les dangers\nFais comme si j'avais pris la mer\n\nJ'ai sorti la grand-voile et j'ai glissé sous le vent\nFais comme si je quittais la terre\nJ'ai trouvé mon étoile, je l'ai suivie un instant\nFais comme si j'avais pris la mer\nJ'ai sorti la grand-voile et j'ai glissé sous le vent\nFais comme si je quittais la terre\nJ'ai trouvé mon étoile, je l'ai suivie un instant\nSous le vent\nSous le vent"},{"n":"Les passantes","a":"Georges Brassens","l":"F","i":"G","d":1,"b":"93","t":"Mi Mineur","c":"","paroles":"Je veux dédier ce poème\nÀ toutes les femmes qu'on aime\nPendant quelques instants secrets\nÀ celles qu'on connait à peine\nQu'un destin différent entraîne\nEt qu'on ne retrouve jamais\nÀ celle qu'on voit apparaître\nUne seconde à sa fenêtre\nEt qui, preste, s'évanouit\nMais dont la svelte silhouette\nEst si gracieuse et fluette\nQu'on en demeure épanoui\nÀ la compagne de voyage\nDont les yeux, charmant paysage\nFont paraître court le chemin ;\nQu'on est seul, peut-être, à comprendre\nEt qu'on laisse pourtant descendre\nSans avoir effleuré la main\nÀ c l\nEt je danse, danse, danse, danse, danse, danse, danse\nEt dans le bruit, je cours et j'ai peur\nEst-ce mon tour ? Revient la douleur\nDans tout Paris, je m'abandonne\nEt je m'envole, vole, vole, vole, vole, vole, vole\n\nDans cette douce souffrance\nDont j'ai payé toutes les offenses\nÉcoute comme mon cœur est immense\nJe suis une enfant du monde\n\nJ'remue le ciel, le jour, la nuit\nJe danse avec le vent, la pluie\nUn peu d'amour, un brin de miel\nEt je danse, danse, danse, danse, danse, danse, danse\nEt dans le bruit, je cours et j'ai peur\nEst-ce mon tour ? Revient la douleur\nDans tout Paris, je m'abandonne\nEt je m'envole, vole, vole, vole, vole, vole, vole"},{"n":"Song for a Dream","a":"Indochine","l":"F","i":"G","d":1,"b":"122","t":"La Majeur","c":"","paroles":"J'aimerais être vivant et ne plus avoir peur\nJ'aimerais aimer mon père\nJ'aimerais savoir quoi faire, j'aimerais bien le comprendre\nJ'aimerais bien qu'il attende\nJ'aimerais être important\nJ'aimerais être un désir\nJ'aimerais être un fossile\nJ'aimerais te voir guérir\nJ'aimerais te voir grandir\nAtténuer tes douleurs\n\nTombera les croix\nMon rêve réussira\nTomberont les diables\nLes dieux n'existent pas\n\nAttaque mes rêves ou détruis mon âme\nOn sera un rêve incroyable\nC'est juste ma vie, c'est juste mon âme\nOn sera un rêve idéal\nOn aura une vie incroyable\nJe voudrais un rêve idéal\n\nJ'aimerais être un guerrier\nQuelqu'un d'effrayant\nJ'aimerais que tu reviennes\nJ'aimerais me sentir bien\nAccueillir des réfugiés\nRevenir en arrière\nJ'aimerais ne plus vieillir\nY avoir jamais cru\nJ'aimerais juste essayer\n\nTombera les croix\nMon rêve réussira\nTombera le diable\nLes dieux n'existent pas\n\nAttaque mes rêves ou détruis les âmes\nOn sera un rêve incroyable\nC'est juste ma vie, c'est juste mon âme\nOn sera un rêve idéal\nTu seras un rêve idéal\n\nOn m'avait dit\nQue toutes mes peurs disparaîtraient\nEt moi la nuit\nJe rêvais d'une vie incroyable\n\n\nEt moi la nuit\nJe voudrais un rêve id uitte pas\nNe me quitte pas\nNe me quitte pas\n\nNe me quitte pas\nJe t'inventerai des mots insensés\nQue tu comprendras\nJe te parlerai de ces amants-là\nQui ont vu deux fois leur cœur s'embraser\nJe te raconterai l'histoire de ce roi\nMort de n'avoir pas pu te rencontrer\n\nNe me quitte pas\nNe me quitte pas\nNe me quitte pas\nNe me quitte pas\n\nOn a vu souvent rejaillir le feu\nDe l'ancien volcan qu'on croyait trop vieux\nIl est, paraît-il, des terres brûlées\nDonnant plus de blé qu'un meilleur avril\nEt quand vient le soir pour qu'un ciel flamboie\nLe rouge et le noir ne s'épousent-ils pas ?\n\nNe me quitte pas\nNe me quitte pas\nNe me quitte pas\nNe me quitte pas\n\nNe me quitte pas\nJe ne vais plus pleurer\nJe ne vais plus parler\nJe me cacherai là\nÀ te regarder\nDanser et sourire\nEt à t'écouter\nChanter et puis rire\nLaisse-moi devenir\nL'ombre de ton ombre\nL'ombre de ta main\nL'ombre de ton chien\n\nNe me quitte pas\nNe me quitte pas\nNe me quitte pas\nNe me quitte pas"},{"n":"Il En Faut Peu Pour Être Heureux","a":"Jean Stout;Pascal Bressy","l":"F","i":"A","d":1,"b":"103","t":"Do Majeur","c":"","paroles":"Écoute, écoute ce que je vais te dire mon petit bonhomme\nTout ce que tu as à savoir c'est que\n\nIl en faut peu pour être heureux\nVraiment très peu pour être heureux\nIl faut se satisfaire du nécessaire\nUn peu d'eau fraîche et de verdure\nQue nous prodigue la nature\nQuelques rayons de miel et de soleil\n\nJe dors d'ordinaire sous les frondaisons\nEt toute la jungle est ma maison\nToutes les abeilles de la forêt\nButinent pour moi dans les bosquets\nEt quand je retourne un gros caillou\nJe sais trouver des fourmis dessous\nEssaye c'est bon, c'est doux!\n\nIl en faut vraiment peu, très peu pour être heureux (Mais, oui)\nPour être heureux\n\nIl en faut peu pour être heureux\nVraiment très peu pour être heureux\nChassez de votre esprit tous vos soucis\nPrenez la vie du bon côté\nRiez, sautez, dansez, chantez\nEt vous serez un ours très bien léché !\n\nCueillir une banane, oui, ça se fait sans astuce (Aïe !)\nMais c'est tout un drame, si c'est un cactus\nSi vous chipez des fruits sans épines, ce n'est pas la peine de faire attention\nMais si le fruit de vos rapines est tout plein d'épines, c'est beaucoup moins bon !\n\nIl en faut vraiment peu, très peu, pour être heureux !\nPour être heureux ?\nPour être heureux !\n\nEt tu verras qu' tout est résolu\nLorsque l'on se passe\nDes choses superflues\nAlors tu ne t'en fais plus\nIl en faut vraiment peu, très peu, pour être heureux\n\nIl en faut peu pour être heureux\nVraiment très peu pour être heureux\nChassez de votre esprit\nTous vos soucis ... Youpi\nPrenez la vie du bon côté\nRiez, sautez, dansez, chantez\nEt vous serez un ours très bien léché !\n- Waouh !\nEt vous serez un ours très bien léché\n\nYoupi !"},{"n":"Je marche seul","a":"Jean-Jacques Goldman","l":"F","i":"P","d":1,"b":"133","t":"Ré Majeur","c":"","paroles":"Comme un bateau dérive\nSans but et sans mobile\nJe marche dans la ville\nTout seul et anonyme\nOh la ville et ses pièges\nCe sont mes privilèges\nJe suis riche de ça\nMais ça ne s'achète pas\n\nJ'm'en fous, j'm'en fous\nDe tout\nDe ces chaînes qui pendent à mon cou\nJ'm'enfuis, j'oublie\nJe m'offre une parenthèse, un sursis\n\nJe marche seul\nDans les rues qui se donnent\nEt la nuit me pardonne\nJe marche seul\nEn oubliant les heures\nJe marche seul\nSans témoin, sans personne\nQue mes pas qui résonnent\nJe marche seul\nActeur et voyeur\n\nSe rencontrer, séduire\nQuand la nuit fait des siennes\nPromettre sans le dire\nJuste des yeux qui trainent\nQuand la vie s'obstine\nDans ces heures assassines\nJe suis riche de ça\nMais ça ne s'achète pas\n\nJ'm'en fous, j'm'en fous\nDe tout\nDe ces chaines qui pendent à mon cou\nJ'm'enfuis, j'oublie\nJe m'offre une parenthèse, un sursis\n\nJe marche seul\nDans les rues qui se donnent\nEt la nuit me pardonne\nJe marche seul\nEn oubliant les heures\nJe marche seul\nSans témoin, sans personne\nQue mes pas qui résonnent\nJe marche seul\nActeur et voyeur\n\nJe marche seul\nQuand ma vie déraisonne\nQuand l'envie m'abandonne\nJe marche seul\nPour me noyer d'ailleurs\n\nJe marche seul\nDans les rues qui se donnent\nEt la nuit me pardonne\nJe marche seul\nEn oubliant les heures\nJe marche seul\nSans témoin, sans personne\nQue mes pas qui résonnent\nJe marche seul\nActeur et voyeur\n\nJe marche seul\nDans les rues qui se donnent\nMais la nuit me pardonne\nJe marche seul\nEn oubliant les heures"},{"n":"Envole-moi","a":"Jean-Jacques Goldman","l":"F","i":"P","d":1,"b":"113","t":"Mi Mineur","c":"","paroles":"Minuit se lève en haut des tours\nLes voix se taisent et tout devient aveugle et sourd\nLa nuit camoufle pour quelques heures\nLa zone sale et les épaves et la laideur\nJ'ai pas choisi de naître ici\nEntre l'ignorance et la violence et l'ennui\nJ'm'en sortirai, j'me le promets\nEt s'il le faut, j'emploierai des moyens légaux\n\nEnvole-moi\nEnvole-moi\nEnvole-moi\nLoin de cette fatalité qui colle à ma peau\nEnvole-moi\nEnvole-moi\nRemplis ma tête d'autres horizons, d'autres mots\nEnvole-moi\n\nPas de question ni rébellion\nRègles du jeu fixées mais les dés sont pipés\nL'hiver est glace, l'été est feu\nIci, y a jamais de saison pour être mieux\nJ'ai pas choisi de vivre ici\nEntre la soumission, la peur ou l'abandon\nJ'm'en sortirai, je te le jure\nÀ coup de livres, je franchirai tous ces murs\n\nEnvole-moi\nEnvole-moi\nEnvole-moi\nLoin de cette fatalité qui colle à ma peau\nEnvole-moi\nEnvole-moi\nRemplis ma tête d'autres horizons, d'autres mots\nEnvole-moi\nEnvole-moi\nEnvole-moi\nEnvole-moi\nLoin de cette fatalité qui colle à ma peau\nEnvole-moi\nEnvole-moi\nRemplis ma tête d'autres horizons, d'autres mots\nEnvole-moi\nMe laisse pas là , emmène-moi, envole-moi\nCroiser d'autres yeux qui ne se résignent pas\nEnvole-moi, tire-moi de là\nMontre-moi ces autres vies que je ne sais pas\nEnvole-moi\nEnvole-moi\nEnvole-moi\nRegarde-moi bien, je ne leur ressemble pas\nMe laisse pas là , envo  les vies oh tournent les violons\nTournent les vies oh tournent les vies oh tournent et s'en vont\nTournent les vies oh tournent les violons"},{"n":"C'est pas vrai","a":"Jean-Jacques Goldman","l":"F","i":"P","d":1,"b":"130","t":"Mi Majeur","c":"","paroles":"Et partout ça mitraille 100 000 vérités\nOn jure on clame on braille\nÇa vient d'tous les côtés, mais c'est pas vrai\nÇa fait pas mal\nTu n'as pas changé\nOn ne sort jamais jamais de son quartier\nC'était très bien\nMoi je ne vote plus\nLes politiciens sont tous corrompus\nTout va plus mal\nC'est le grand capital\nJe te le rendrai\nC'est la destinée\nC'est tel père tel fils\nC'est maman ou putain\nLa femme de ma vie\nÇa vous va très bien\nEt partout ça mitraille 100 000 vérités\nOn jure on clame on braille, ça vient d'tous les cotés\nRadios et haut parleurs, des chaînes par milliers\nEt passent les rumeurs promis craché juré\nVérifié, officiel, certifié\nMais... c'est pas vrai l'amour ça dure pas\nQuelle soirée super !\nT'es trop bien pour moi\nNous c'est pas pareil\nAppelle on en parle\nQuand tu veux tu passes\nC'est inévitable, un jour on se lasse\nJe ne démissionnerai pas je le jure\nOh cette crème gomme vos vergetures\nTout se paye un jour\nJ'arrête quand je veux\nC'est chacun son tour\nJe fais ce que je peux\nEt partout ça mitraille 100 000 vérités\nOn jure on clame on braille\nÇa vient d'tous les cotés\nRadios et haut parleurs des télés par milliers\nDes infos des rumeurs\nLes diplômes n'empêchent pas d'être chômeur (c'est pas vrai !)\nLes vaches sont herbivores (c'est pas vrai !)\nFaut être un tueur pour réussir (c'est pas vrai !)\nLà, normalement ça devrait marcher (c'est pas vrai !)\nNe quittez pas, un agent va vous répondre (c'est pas vrai !)\nSans piston on arrive à rien (c'est pas vrai !)\nMolière est mort sur scène (c'est pas vrai !)\nCe joueur est intransférable (c'est pas vrai !)\nY a plus de morale (c'est pas vrai !)\nC'est à deux pas, y'en pour cinq minutes (c'est pas vrai !)\nJe suis désolé (c' "Elle a fait un bébé toute seule\nElle a fait un bébé toute seule\nC'était dans ces années un peu folles\nOù les papas n'étaient plus à la mode\nOuh, elle a fait un bébé toute seule\nElle a fait un bébé toute seule\nElle a fait un bébé toute seule\nElle a choisi l'père en scientifique\nPour ses gènes, son signe astrologique\nOuh, elle a fait un bébé toute seule\n\nEt elle court toute la journée\nElle court de décembre en été\nDe la nourrice à la baby-sitter\nDes paquets de couches au biberon de quatre heures\nEt elle fume, fume, fume même au petit-déjeuner\n\nElle défait son grand lit toute seule\nElle défait son grand lit toute seule\nEt elle vit comme dans tous ces magazines\nOù le fric et les hommes sont faciles\nOuh, elle défait son grand lit toute seule\n\nEt elle court toute la journée\nElle court de décembre en été\nLe garage, la gym et le blues alone\nEt les copines qui pleurent des heures au téléphone\nElle assume, 'sume, 'sume sa nouvelle féminité\n\n\nEt elle court toute la journée\nElle court de décembre en été\nDe la nourrice à la baby-sitter\nDes paquets de couches au biberon de quatre heures\nEt elle fume, fume, fume même au petit-déjeuner\n\nElle m'téléphone quand elle est mal\nQuand elle peut pas dormir\nJ'l'emmène au cinéma, j'lui fais des câlins\nJ'la fais rire\nUn peu comme un grand frère, un peu\nIncestueux quand elle veut\nPuis son gamin, c'est presque l'mien\nSauf qu'il a les yeux bleus\nElle a fait un bébé toute seule"},{"n":"Un goût sur tes lèvres","a":"Jean-Jacques Goldman","l":"F","i":"P","d":1,"b":"130","t":"Do Majeur","c":"","paroles":"C'est un goût sur tes lèvres, juste après les baisers\nUne amertume à peine devinée\nCombien de coups, crois-tu avant que tu dénonces?\nCombien de peurs avant de supplier?\nCombien de jours de faim, as-tu la réponse?\nAvant de te battre, avant de ramper\nCombien de pouvoir, avant d'en abuser?\nDe désillusion avant de quitter?\nCombien d'alcool pour tenir à la mine?\nDe chantage avant que tu ne t'inclines?\ ai toujours la même, un peu bohème\nPrête à faire des folies\nJe serai, même si la vie nous sépare\nCelle qui te redonnera l'espoir\nOn ne laissera rien au hasard\nCar tu sais que je resterai ta meilleure amie"},{"n":"Je vole","a":"Louane","l":"F","i":"P","d":1,"b":"176","t":"Ré# Majeur","c":"","paroles":"Mes chers parents, je pars\nJe vous aime, mais je pars\nVous n'aurez plus d'enfant, ce soir\nJe n'm'enfuis pas, je vole\nComprenez bien, je vole\nSans fumée, sans alcool\nJe vole, je vole\n\nElle m'observait hier\nSoucieuse, troublée, ma mère\nComme si elle le sentait\nEn fait, elle se doutait, entendait\nJ'ai dit que j'étais bien\nTout à fait, l'air serein\nElle a fait comme de rien\nEt mon père, démuni, a souri\nNe pas se retourner\nS'éloigner un peu plus\nIl y a gare, une autre gare\nEt enfin, l'Atlantique\n\nMes chers parents, je pars\nJe vous aime, mais je pars\nVous n'aurez plus d'enfant, ce soir\nJe n'm'enfuis pas, je vole\nComprenez bien, je vole\nSans fumée, sans alcool\nJe vole, je vole\n\nJ'me demande, sur ma route\nSi mes parents se doutent\nQue mes larmes ont coulé\nMes promesses et l'envie d'avancer\nSeulement croire en ma vie\nTout ce qui m'est promis\nPourquoi, où et comment ?\nDans ce train qui s'éloigne\nChaque instant\nC'est bizarre cette cage\nQui me bloque la poitrine\nJe n'peux plus respirer\nÇa m'empêche de chanter\n\nMes chers parents, je pars\nJe vous aime, mais je pars\nVous n'aurez plus d'enfant, ce soir\nJe n'm'enfuis pas, je vole\nComprenez bien, je vole\nSans fumée, sans alcool\nJe vole, je vole\n\nLa-la-la-la-la-la\nLa-la-la, la-la-la\nLa-la-la, la-la-la\nJe vole, je vole"},{"n":"Je vais t'aimer","a":"Louane","l":"F","i":"P","d":1,"b":"132","t":"La# Mineur","c":"","paroles":"Paroles {Je Vais T'aimer}\n\nÀ faire pâlir tous les marquis de Sade\nÀ faire rougir les putains de La Rade\nÀ faire crier grâce à tous les échos\nÀ faire trembler les murs de Jéricho, je vais t'aimer\nÀ faire flamber des enfers dans tes yeux\nÀ faire jurer tous les tonnerres de Dieu\nÀ faire dresser tes seins et tous les Saints\nÀ faire prier et supplier nos mains, je vais t'aimer\n\nJe vais t'aimer comme on ne t'a jamais aimé\nJe vais t'aimer plus loin que tes rêves ont imaginé\nJe vais t'aimer, je vais t'aimer\nJe vais t'aimer comme personne n'a osé t'aimer\nJe vais t'aimer comme j'aurais tellement aimé être aimée\nJe vais t'aimer, je vais t'aimer\n\nÀ faire vieillir, à faire blanchir la nuit\nÀ faire brûler la lumière jusqu'au jour\nÀ la passion et jusqu'à la folie\nJe vais t'aimer, je vais t'aimer d'amour\nÀ faire cerner, à faire fermer nos yeux\nÀ faire souffrir, à faire mourir nos corps\nÀ faire voler nos âmes aux septièmes cieux\nÀ se croire mort et faire l'amour encore, je vais t'aimer\n\nJe vais t'aimer comme on ne t'a jamais aimé\nJe vais t'aimer plus loin que tes rêves ont imaginé\nJe vais t'aimer, je vais t'aimer\nJe vais t'aimer comme personne n'a osé t'aimer\nJe vais t'aimer comme j'aurais tellement aimé être aimée\nJe vais t'aimer, je vais t'aimer"},{"n":"Elle me contrôle","a":"M. Pokora;Lady Sweety","l":"F","i":"P","d":1,"b":"107","t":"Sol Mineur","c":"","paroles":"Come on, come on\nHuh\nElle me contrôle\nHuh\n\nL'un sur l'autre, brûlants\nLa chaleur en fusion sous ta peau\nYeah, yeah\n(Uh-huh, uh, uh, come on, come on)\nTu sais que je t'ai cherchée (Yeah)\nAu crépuscule sur cette plage dorée (Hmm)\nTu es désirée de tous\nSur cette île, moi seul peut te combler\nEverybody jump up, come on ! (Oh !)\n\nElle me contrôle\nEt rythme mes pas\nSi elle me frôle (Oh no !)\nOh non, je ne réponds, réponds, réponds plus de moi\nSur la dancehall\nÉcoute ma voix\nSi tu me frôles\nAlors, je ne réponds, réponds, réponds plus de moi\n\nL'un sur l'autre (Uh-huh ; l'un sur l'autre)\nCherchant la fraîcheur à l'ombre du ghetto (Yeah)\nYeah, yeah\n(Uh-huh, uh-huh, uh-huh, come on)\nTu sais (Tu sais) que tout a changé, babe\nTon corps en nage trouble les alizés (Yeah, yeah yeah)\nLe désir aux alentours\nSur cette île, tout le monde e, je chante avec eux (No more killing)\nNo, no, no (No more fighting)\nNo, no, no (No more killing)"},{"n":"Simon Papa Tara","a":"Yannick Noah","l":"F","i":"P","d":1,"b":"102","t":"Sol Mineur","c":"","paroles":"Tu es venu ce matin à l'heure ou la nuit meurt\nTu es venu de si loin, d'où la mort ne fait plus peur\nTu es venu me parler un peu de notre vie\nMême veste et même chapeau, le Noah de fer africain\n\nOui je sais que tu vis en moi, Simon Papa Tara\nOui je sais que tu es en moi, Noah Bikie Noah\nTu sais grand-père, ici ils ne croient pas à ces choses-là\n\nTu es venu ce matin, Simon Papa Tara\nTu es la mort sans chagrin, l'ancêtre de Noah\nUn clair à Étudi, comme un soir de Juin\nTu es venu ce matin, le Noah de fer africain\n\nOui je sais que tu vis en moi, Simon Papa Tara\nOui je sais que tu es en moi, Noah Bikie Noah\nTu sais grand-père, ici ils ne croient pas à ces choses-là\n\nTu es venu ce matin, me dire le chemin\nTu es venu de si loin pour me parler des miens\nEt pour me dire que l'amour, c'est donner chaque jour\nTu es venu de si loin, le Noah de fer africain"},{"n":"Clic clic pan pan","a":"Yanns","l":"F","i":"P","d":1,"b":"132","t":"La# Mineur","c":"","paroles":"T'étais mon chouchou\nJ'peux pas oublier le passé\nOublier l'passé\nT'étais mon chouchou\nJ'peux pas t'effacer\n\nT'es la plus belle des étoiles, parmi les autres, je vois que toi (Je vois que toi)\nSi tu te sens seule, dis-moi (Dis-moi), il reste une place auprès de moi (Auprès de moi)\nLes projecteurs sur toi (Ouh), c'est fou comment tu brilles dans l'noir (C'est fou)\nT'es la plus belle mademoiselle, comment j'aurais fait pour pas t'voir ? (Voir)\nJ'sais qu'lе passé c'est l'passé (Ouais, c'est l'passé)\nMais entrе nous, j'peux pas dire ce qu'il s'est passé (J'peux pas dire ce qu'il s'est passé)\nJ'voudrais pouvoir rattraper l'temps (Rattraper l'temps)\nPour que tu partes, dis-moi qu'est-ce que j'ai fait, bon sang (Qu'est-ce que j'ai fait, bon sang ?)\n\nJ'sais qu'le passé c'est le passé mais y a qu'à toi qu'j'peux m'confier\nTu sais, je deviens parano des fois, quand j'reste seul, direct, j'pense à toi\n\nEt ça fait \"clic, clic-clic, pan-pan-pan\"\nJ'braque ton petit cœur, ma chérie, t'es trop séduisante\nT'étais mon chouchou, j'sais pas ce qui c'est passé (Nan)\nJe repense à toi chaque jour, j'aimerais recoller ce qui est cassé\nTu m'dis qu'c'est fini, qu'y a plus d'nous (Nous), j'ferais mieux de t'effacer (Ouais, t'effacer)\nJe sais pas à quoi tu joues mais j'peux pas oublier le passé\n\nJ'peux pas oublier le passé, oublier le passé\nT'étais mon chouchou, j'peux pas t'effacer\n\nT'es la plus belle des étoiles (Eh), parmi les autres, je vois que toi (Je vois que toi)\nSi tu te sens seule, dis-moi (Dis-moi), il reste une place auprès de moi (Auprès de moi)\nLes projecteurs sur toi (Ouh), c'est fou comment tu brilles dans l'noir (C'est fou)\nT'es la plus belle mademoiselle, comment j'aurais fait pour pas te voir ? (Voir)\nJe sens que tu caches quelque chose (Ouais), c'est bon, me mens pas (Me mens pas)\nT'es plus du tout comme avant, j'sais pas c'qui s'passe, j'te reconnais pas (J'te reconnais pas)\nJ'sais qu'parfois je suis con (Con) mais j'reste premier dans ton cœur (Ouais, dans ton cœur)\nSi les minutes sont des secondes (Ouh), j'te ferai l'amour pendant des heures (Pah)\n\nJ'sais qu'le passé c'est le passé mais y a qu'à toi qu'j'peux m'confier\nTu sais, je deviens parano des fois, quand j'reste seul, direct, j'pense à toi\n\nEt ça fait \"clic, clic-clic, pan-pan-pan\"\nJ'braque ton petit cœur, ma chérie, t'es trop séduisante\nT'étais mon chouchou, j'sais pas ce qui c'est passé (Nan)\nJe repense à toi chaque jour, j'aimerais recoller ce qui est cassé\nTu m'dis qu'c'est fini, qu'y a plus d'nous (Nous), j'ferais mieux de t'effacer (Ouais, t'effacer)\nJe sais pas à quoi tu joues mais j'peux pas oublier le passé\n\nEt ça fait \"clic, clic-clic, pan-pan-pan\"\nJ'braque ton petit cœur, ma chérie, t'es trop séduisante\nEt ça fait \"clic, clic-clic, pan-p const SETLIST=null;
const DIFF=['','⭐','⭐⭐','⭐⭐⭐'];
const INAME={G:'Guitare',P:'Piano',A:'Autre'};
const IICO={G:'🎸',P:'🎹',A:'🎵'};
const LNAME={E:'EN',F:'FR',I:'IT/ES'};
let q='',af='all';
const si=document.getElementById('si');
const clr=document.getElementById('clr');
const list=document.getElementById('list');
const cn=document.getElementById('cn');
