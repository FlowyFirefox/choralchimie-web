function hl(t,q){if(!q)return t;return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}

function card(s,idx){
  const sp='https://open.spotify.com/search/'+encodeURIComponent(s.n+' '+s.a);
  const dz='https://www.deezer.com/search/'+encodeURIComponent(s.n+' '+s.a);
  const cleanTitle=s.n.replace(/\s*[-–]\s*(\d{4}\s+)?(remaster(ed)?|live|remix|version|acoustic|radio edit|feat\.?|ft\.?).*/i,'').trim();
  const ge='https://genius.com/search?q='+encodeURIComponent(s.a+' '+cleanTitle);
  const ug='https://www.ultimate-guitar.com/search.php?search_type=title&value='+encodeURIComponent(s.n);
  const lc='l'+s.l;
  const ii=IICO[s.i]||'🎵';
  const capo=s.c?'<span class="capo">'+s.c+'</span>':'';
  const bpm=s.b?'<span class="tag tb">♩'+s.b+'</span>':'';
  const bpmk=s.b?'<span class="kb">♩ <strong>'+s.b+' BPM</strong></span>':'';
  const e=document.createElement('div');
  e.textContent=sp;const esp=e.innerHTML.replace(/"/g,'&quot;');
  e.textContent=dz;const edz=e.innerHTML.replace(/"/g,'&quot;');
  e.textContent=ge;const ege=e.innerHTML.replace(/"/g,'&quot;');
  e.textContent=ug;const eug=e.innerHTML.replace(/"/g,'&quot;');
  return '<li class="si-item" data-idx="'+idx+'">'
    +'<div class="si-top" data-tg="'+idx+'">'
      +'<div class="lang '+lc+'">'+LNAME[s.l]+'</div>'
      +'<div class="si-info">'
        +'<div class="si-name">'+hl(s.n,q)+'</div>'
        +'<div class="si-artist">'+hl(s.a,q)+'</div>'
        +'<div class="si-tags"><span class="tag td">'+DIFF[s.d]+'</span><span class="tag ti">'+ii+' '+INAME[s.i]+'</span>'+bpm+'</div>'
      +'</div>'
      +'<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>'
    +'</div>'
    +'<div class="si-actions"><div class="act-inner">'
      +'<div class="ki"><span class="kb">🎵 <strong>'+s.t+'</strong></span>'+bpmk+capo+'</div>'
      +'<div class="abtns">'
        +(s.paroles?'<button class="abtn bge" data-lyrics="'+idx+'">📖 Paroles</button>':'<button class="abtn bge" data-href="'+ege+'">📖 Paroles — Genius</button>')
        +'<button class="abtn bsp" data-href="'+esp+'" data-sp>🎤 Spotify</button>'
        +'<button class="abtn bdz" data-href="'+edz+'" data-dz>🎵 Deezer</button>'
        +'<button class="abtn bjr" data-href="'+eug+'">'+ii+' Pour jouer</button>'
      +'</div>'
    +'</div></div>'
  +'</li>';
}

function render(){
  const q2=q.toLowerCase();
  const res=S.filter(s=>{
    const ok=!q2||(s.n.toLowerCase().includes(q2)||s.a.toLowerCase().includes(q2));
    if(!ok)return false;
    if(af==='all')return true;
    if(af==='E'||af==='F'||af==='I')return s.l===af;
    if(af==='1')return s.d===1;
    if(af==='2')return s.d===2;
    if(af==='3')return s.d===3;
    if(af==='P'||af==='G')return s.i===af;
    return true;
  });
  const n=res.length;
  cn.textContent=n;
  rbar.textContent=n===0?'Aucun résultat':n+' morceau'+(n>1?'x':'')+' trouvé'+(n>1?'s':'');
  if(n===0){list.innerHTML='<div class="empty"><div class="empty-t">Aucun morceau</div><div>Essayez un autre filtre</div></div>';return;}
  list.innerHTML=res.map(s=>card(s,S.indexOf(s))).join('');
}

function openLink(url){
  var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function openSpotify(url){
  var enc=url.replace('https://open.spotify.com/search/','');
  window.location.href='spotify:search:'+enc;
  var t=Date.now();setTimeout(function(){if(document.hasFocus()&&Date.now()-t<3000)openLink(url);},1500);
}
function openDeezer(url){
  var enc=url.replace('https://www.deezer.com/search/','');
  window.location.href='deezer://search?query='+enc;
  var t=Date.now();setTimeout(function(){if(document.hasFocus()&&Date.now()-t<3000)openLink(url);},1500);
}

document.addEventListener('click',function(e){
  var lb=e.target.closest('[data-lyrics]');
  if(lb){
    e.stopPropagation();
    var fromSetlist=!!lb.closest('#setlistList');
    openLyricsOverlay(+lb.dataset.lyrics, fromSetlist);
    return;
  }
  var btn=e.target.closest('[data-href]');
  if(btn){
    e.stopPropagation();
    var url=btn.getAttribute('data-href');
    if(btn.hasAttribute('data-sp'))openSpotify(url);
    else if(btn.hasAttribute('data-dz'))openDeezer(url);
    else openLink(url);
    return;
  }
  var tg=e.target.closest('[data-tg]');
  if(tg){
    var item=tg.closest('.si-item');
    if(!item)return;
    var container=item.parentElement;
    var items=container.querySelectorAll('.si-item');
    var was=item.classList.contains('open');
    items.forEach(function(el){el.classList.remove('open');});
    if(!was)item.classList.add('open');
    if(container.id==='setlistList'){
      var pg=document.getElementById('setlistProgress');
      if(pg && typeof SETLIST==='object' && SETLIST && SETLIST.songs){
        var op=container.querySelector('.si-item.open');
        var nb=SETLIST.songs.length;
        var nm=op?op.querySelector('.setlist-num'):null;
        var txt=op?(nm?nm.textContent+' / '+nb:'Backup'):(nb+' titres');
        if(pg.textContent!==txt){
          pg.style.opacity='0';
          setTimeout(function(){pg.textContent=txt;pg.style.opacity='1';},150);
        }
      }
    }
  }
});

si.addEventListener('input',function(){q=si.value;clr.classList.toggle('on',q.length>0);render();});
clr.addEventListener('click',function(){si.value='';q='';clr.classList.remove('on');si.focus();render();});
filt.addEventListener('click',function(e){
  var c=e.target.closest('.chip');if(!c)return;
  document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on','br','am');});
  c.classList.add('on');
  af=c.dataset.f;
  var warm=['all','E','1'];
  c.classList.add(warm.includes(af)?'br':'am');
  render();
});

// Setlist du soir
function openSetlist(){
  var ov=document.getElementById('setlistOverlay');
  document.getElementById('setlistTitle').textContent=SETLIST.label;
  function findIdx(s){return S.indexOf(S.find(function(x){return x.n===s.n&&x.a===s.a;}));}
  var mainHtml=(SETLIST.songs||[]).map(function(s,i){
    return card(s,findIdx(s)).replace('<div class="lang','<div class="setlist-num">'+(i+1)+'</div><div class="lang');
  }).join('');
  var bkHtml=(SETLIST.backup||[]).map(function(s){return card(s,findIdx(s));}).join('');
  var html=mainHtml;
  if(bkHtml) html+='<li class="setlist-divider">Backups</li>'+bkHtml;
  document.getElementById('setlistList').innerHTML=html;
  var slItems=document.getElementById('setlistList').querySelectorAll('.si-item');
  slItems.forEach(function(item,i){
    var inner=item.querySelector('.si-actions .act-inner');
    if(!inner) return;
    var dPrev=i===0?' disabled':'';
    var dNext=i===slItems.length-1?' disabled':'';
    inner.insertAdjacentHTML('beforeend',
      '<div class="setlist-nav">'+
        '<button class="snav" data-snav="prev"'+dPrev+'>← Précédent</button>'+
        '<button class="snav" data-snav="next"'+dNext+'>Suivant →</button>'+
      '</div>');
  });
  var pg=document.getElementById('setlistProgress');
  if(pg){
    pg.style.opacity='1';
    pg.textContent=(SETLIST.songs||[]).length+' titres';
  }
  ov.classList.add('open');
}
if(SETLIST && ((SETLIST.songs && SETLIST.songs.length>0) || (SETLIST.backup && SETLIST.backup.length>0))){
  var slWrap=document.getElementById('setlistBtnWrap');
  if(slWrap){
    var slMeta=SETLIST.meta?'<div class="sl-meta">'+SETLIST.meta+'</div>':'';
    slWrap.innerHTML='<button class="setlist-btn" id="setlist-btn" onclick="openSetlist()">'+SETLIST.label+slMeta+'</button>';
  }
}

// Setlist : swipe vers le bas pour fermer l'overlay
(function(){
  var ov=document.getElementById('setlistOverlay');
  if(!ov)return;
  var sy=0,sx=0,allowed=false;
  ov.addEventListener('touchstart',function(e){
    var t=e.touches[0];
    sy=t.clientY; sx=t.clientX;
    allowed=!!e.target.closest('.setlist-header')||ov.scrollTop===0;
  },{passive:true});
  ov.addEventListener('touchend',function(e){
    if(!allowed)return;
    var t=e.changedTouches[0];
    var dy=t.clientY-sy, dx=t.clientX-sx;
    if(dy>80 && Math.abs(dx)<30) closeSetlistOverlay();
  },{passive:true});
})();

// Setlist : navigation Précédent / Suivant
(function(){
  var sl=document.getElementById('setlistList');
  if(!sl)return;
  sl.addEventListener('click',function(e){
    var nav=e.target.closest('[data-snav]');
    if(!nav||nav.disabled)return;
    e.stopPropagation();
    var items=Array.from(sl.querySelectorAll('.si-item'));
    var cur=nav.closest('.si-item');
    var idx=items.indexOf(cur);
    var dir=nav.getAttribute('data-snav')==='next'?1:-1;
    var nx=items[idx+dir];
    if(!nx)return;
    items.forEach(function(el){el.classList.remove('open');});
    nx.classList.add('open');
    var pg=document.getElementById('setlistProgress');
    if(pg && typeof SETLIST==='object' && SETLIST && SETLIST.songs){
      var nb=SETLIST.songs.length;
      var nm=nx.querySelector('.setlist-num');
      var txt=nm?nm.textContent+' / '+nb:'Backup';
      if(pg.textContent!==txt){
        pg.style.opacity='0';
        setTimeout(function(){pg.textContent=txt;pg.style.opacity='1';},150);
      }
    }
    nx.scrollIntoView({behavior:'smooth',block:'center'});
  });
})();

// Wake Lock — garder l'écran allumé pendant la setlist
var wakeLock=null;
var wakeLockWanted=false;
async function requestWakeLock(){
  if(!('wakeLock' in navigator))return false;
  try{
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',function(){
      wakeLock=null;
      var b=document.getElementById('wakeLockBtn');
      if(b)b.classList.remove('active');
    });
    return true;
  }catch(e){
    console.warn('[WakeLock]',e);
    return false;
  }
}
async function releaseWakeLock(){
  wakeLockWanted=false;
  if(wakeLock){
    try{await wakeLock.release();}catch(e){}
    wakeLock=null;
  }
  var b=document.getElementById('wakeLockBtn');
  if(b)b.classList.remove('active');
}
async function toggleWakeLock(){
  if(wakeLock){
    await releaseWakeLock();
  }else{
    var ok=await requestWakeLock();
    if(ok){
      wakeLockWanted=true;
      var b=document.getElementById('wakeLockBtn');
      if(b)b.classList.add('active');
    }
  }
}
function closeSetlistOverlay(){
  releaseWakeLock();
  var ov=document.getElementById('setlistOverlay');
  if(ov)ov.classList.remove('open');
}
document.addEventListener('visibilitychange',async function(){
  if(document.visibilityState==='visible' && wakeLockWanted && !wakeLock){
    var ok=await requestWakeLock();
    if(ok){
      var b=document.getElementById('wakeLockBtn');
      if(b)b.classList.add('active');
    }
  }
});
(function(){
  var btn=document.getElementById('wakeLockBtn');
  if(!btn)return;
  if(!('wakeLock' in navigator)){
    btn.style.display='none';
    return;
  }
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    toggleWakeLock();
  });
})();

// Lyrics — overlay branded
function openLyricsOverlay(idx, fromSetlist){
  var s=S[idx];
  if(!s||!s.paroles)return;
  document.getElementById('lyricsTitle').textContent=s.n;
  document.getElementById('lyricsArtist').textContent=s.a;
  var lines=s.paroles.split('\n');
  var html='';
  lines.forEach(function(line){
    line=line.trim();
    if(!line){
      html+='<div style="height:8px"></div>';
    }else if(line.startsWith('[')&&line.endsWith(']')){
      html+='<div class="lyrics-section-label">'+line.slice(1,-1).replace(/</g,'&lt;')+'</div>';
    }else{
      html+='<p class="lyrics-line">'+line.replace(/</g,'&lt;')+'</p>';
    }
  });
  html+='<div class="lyrics-watermark">La ChorAlchimie Lyon · @lachoralchimie</div>';
  document.getElementById('lyricsBody').innerHTML=html;
  var lyBody=document.getElementById('lyricsBody');
  lyBody.querySelectorAll('.lyrics-line').forEach(function(el){
    el.style.lineHeight=SPACING_LEVELS[lyricsSpacing];
  });
  var ov=document.getElementById('lyricsOverlay');
  ov.classList.add('open');
  ov.scrollTop=0;

  // Progress bar — réattacher un handler propre à chaque ouverture
  document.getElementById('lyricsProgressBar').style.width='0%';
  var _lyricsScroll=function(){
    var pct=ov.scrollTop/(ov.scrollHeight-ov.clientHeight)*100;
    document.getElementById('lyricsProgressBar').style.width=Math.min(100,pct||0)+'%';
  };
  ov.removeEventListener('scroll',ov._lyricsScrollHandler||null);
  ov._lyricsScrollHandler=_lyricsScroll;
  ov.addEventListener('scroll',_lyricsScroll,{passive:true});

  // Chip prochaine chanson de la setlist (avec paroles)
  var chip=document.getElementById('lyricsNextChip');
  chip.className='';
  chip.onclick=null;
  if(fromSetlist && SETLIST && SETLIST.songs){
    var setlistSongs=SETLIST.songs;
    var norm=function(x){return (x||'').trim().toLowerCase();};
    var curN=norm(S[idx].n), curA=norm(S[idx].a);
    var pos=-1;
    for(var k=0;k<setlistSongs.length;k++){
      if(norm(setlistSongs[k].n)===curN && norm(setlistSongs[k].a)===curA){
        pos=k; break;
      }
    }
    var nextIdx=-1;
    for(var j=pos+1;j<setlistSongs.length;j++){
      var slN=norm(setlistSongs[j].n), slA=norm(setlistSongs[j].a);
      for(var m=0;m<S.length;m++){
        if(norm(S[m].n)===slN && norm(S[m].a)===slA && S[m].paroles){
          nextIdx=m; break;
        }
      }
      if(nextIdx>=0) break;
    }
    if(nextIdx>=0){
      var nextTitle=S[nextIdx].n.length>12?S[nextIdx].n.slice(0,12)+'…':S[nextIdx].n;
      chip.textContent='→ '+nextTitle;
      chip.className='visible';
      chip.onclick=function(e){
        e.stopPropagation();
        openLyricsOverlay(nextIdx, true);
      };
    }
  }
}
function closeLyricsOverlay(){
  var ov=document.getElementById('lyricsOverlay');
  if(ov)ov.classList.remove('open');
}
// Swipe down to close (même pattern que setlist)
(function(){
  var ov=document.getElementById('lyricsOverlay');
  if(!ov)return;
  var sy=0,sx=0,allowed=false;
  ov.addEventListener('touchstart',function(e){
    var t=e.touches[0];
    sy=t.clientY; sx=t.clientX;
    allowed=!!e.target.closest('.lyrics-header')||ov.scrollTop===0;
  },{passive:true});
  ov.addEventListener('touchend',function(e){
    if(!allowed)return;
    var t=e.changedTouches[0];
    var dy=t.clientY-sy, dx=t.clientX-sx;
    if(dy>80 && Math.abs(dx)<30) closeLyricsOverlay();
  },{passive:true});
})();

// Lyrics — pinch-to-zoom + double-tap reset (zoom partagé entre chansons)
var lyricsScale=1;
(function(){
  var body=document.getElementById('lyricsBody');
  if(!body)return;
  var startDist=0, startScale=1, lastTap=0;
  function dist(a,b){
    var dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }
  function clamp(v){return Math.max(0.8,Math.min(2.5,v));}
  body.addEventListener('touchstart',function(e){
    if(e.touches.length===2){
      startDist=dist(e.touches[0],e.touches[1]);
      startScale=lyricsScale;
    }else if(e.touches.length===1){
      var now=Date.now();
      if(now-lastTap<300){
        lyricsScale=1;
        body.style.transform='scale(1)';
        lastTap=0;
      }else{
        lastTap=now;
      }
    }
  },{passive:true});
  body.addEventListener('touchmove',function(e){
    if(e.touches.length===2 && startDist>0){
      e.preventDefault();
      var d=dist(e.touches[0],e.touches[1]);
      lyricsScale=clamp(startScale*(d/startDist));
      body.style.transform='scale('+lyricsScale+')';
    }
  },{passive:false});
  body.addEventListener('touchend',function(e){
    if(e.touches.length<2) startDist=0;
  },{passive:true});
})();

// Lyrics — fond clair/sombre + hauteur de ligne (préfs partagées entre chansons)
var lyricsLight=false;
function toggleLyricsTheme(){
  lyricsLight=!lyricsLight;
  var ov=document.getElementById('lyricsOverlay');
  var btn=document.getElementById('lyricsThemeBtn');
  if(lyricsLight){
    ov.classList.add('light');
    btn.textContent='☀️';
  }else{
    ov.classList.remove('light');
    btn.textContent='🌙';
  }
}
var lyricsSpacing=0;
var SPACING_LEVELS=[1.8,2.4,3.0];
function cycleLyricsSpacing(){
  lyricsSpacing=(lyricsSpacing+1)%3;
  var lh=SPACING_LEVELS[lyricsSpacing];
  var body=document.getElementById('lyricsBody');
  if(body) body.querySelectorAll('.lyrics-line').forEach(function(el){
    el.style.lineHeight=lh;
  });
  var btn=document.getElementById('lyricsSpacingBtn');
  if(btn){
    btn.style.opacity=lyricsSpacing===0?'0.5':'1';
    btn.textContent=lyricsSpacing===0?'↕':lyricsSpacing===1?'↕↕':'↕↕↕';
  }
}

render();
</script>

<!-- Modal suggestion -->
<div class="modal-overlay" id="suggestOverlay"></div>
<div class="modal-sheet" id="suggestSheet">
  <div class="modal-handle"></div>
  <div class="modal-title">Proposer un titre</div>
  <form id="suggestForm">
    <div class="modal-field">
      <label>Titre *</label>
      <input type="text" id="sgTitle" placeholder="Nom du morceau" required>
    </div>
    <div class="modal-field">
      <label>Artiste *</label>
      <input type="text" id="sgArtist" placeholder="Nom de l'artiste">
    </div>
    <div class="modal-field">
      <label>Langue</label>
    </div>
    <div class="modal-chips" id="sgLangChips">
      <div class="mchip" data-val="Anglais">🇬🇧 Anglais</div>
      <div class="mchip" data-val="Français">🇫🇷 Français</div>
      <div class="mchip" data-val="Autre">🌍 Autre</div>
    </div>
    <div class="modal-field">
      <label>Instrument (optionnel)</label>
      <input type="text" id="sgInstrument" placeholder="Piano, guitare...">
    </div>
    <button type="submit" class="modal-submit" id="sgSubmit">Envoyer la suggestion</button>
  </form>
</div>
<div class="modal-toast" id="sgToast"></div>

<script>
(function(){
  var APPS_SCRIPT_SUGGESTIONS_URL = 'https://script.google.com/macros/s/AKfycbw777HCJidq_qLbPdrHqfYFTVf6ufxCSKNz1-gBS0z-thYu4g06A07LJ5GGExbVAZD5/exec';

  var fab = document.getElementById('fabSuggest');
  var overlay = document.getElementById('suggestOverlay');
  var sheet = document.getElementById('suggestSheet');
  var form = document.getElementById('suggestForm');
  var toast = document.getElementById('sgToast');

  function openModal() { overlay.classList.add('open'); sheet.classList.add('open'); }
  function closeModal() { overlay.classList.remove('open'); sheet.classList.remove('open'); }

  fab.addEventListener('click', openModal);
  overlay.addEventListener('click', closeModal);

  // Chips single-select
  document.getElementById('sgLangChips').addEventListener('click', function(e) {
    var c = e.target.closest('.mchip');
    if (!c) return;
    var was = c.classList.contains('on');
    this.querySelectorAll('.mchip').forEach(function(x) { x.classList.remove('on'); });
    if (!was) c.classList.add('on');
  });

  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = 'modal-toast ' + type + ' show';
    setTimeout(function() { toast.classList.remove('show'); }, 3500);
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var titre = document.getElementById('sgTitle').value.trim();
    var artiste = document.getElementById('sgArtist').value.trim();
    if (!titre) { showToast('Ajoute au moins un titre', 'err'); return; }

    var langChip = document.querySelector('#sgLangChips .mchip.on');
    var langue = langChip ? langChip.dataset.val : '';

    var btn = document.getElementById('sgSubmit');
    btn.disabled = true;
    btn.textContent = 'Envoi...';

    fetch(APPS_SCRIPT_SUGGESTIONS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        titre: titre,
        artiste: artiste,
        langue: langue,
        instrument: document.getElementById('sgInstrument').value.trim(),
        source: 'App Choraoké'
      }),
      redirect: 'follow'
    })
    .then(function(r) { return r.text(); })
    .then(function() {
      showToast('Merci pour ta suggestion 🎶', 'ok');
      form.reset();
      document.querySelectorAll('#sgLangChips .mchip.on').forEach(function(c) { c.classList.remove('on'); });
      closeModal();
      btn.disabled = false; btn.textContent = 'Envoyer la suggestion';
    })
    .catch(function() {
      showToast('Erreur réseau', 'err');
      btn.disabled = false; btn.textContent = 'Envoyer la suggestion';
    });
  });
})();
</script>
